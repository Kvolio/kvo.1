<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0d12'/%3E%3Crect x='18' y='4' width='7' height='24' fill='%237d8798'/%3E%3Cpath d='M4 16 L13 12 L13 20 Z' fill='%23d8564a'/%3E%3C/svg%3E">
<title>Terminal Ballistics Sandbox — deformable armour / dynamic projectile simulation</title>
<style>
:root{
  --bg:#0a0d12; --bg2:#11151c; --panel:#141922; --panel2:#1b212c;
  --edge:#252d3a; --edge2:#323b4b;
  --ink:#d6dde6; --ink2:#98a3b2; --dim:#6d7787;
  --accent:#4fb0d8; --accent2:#2b6f8c;
  --warn:#e0a23c; --danger:#d8564a; --ok:#5fbf7f;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --row:26px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--mono);font-size:12px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

#app{display:grid;height:100%;
  grid-template-columns:var(--lw,280px) 1fr var(--rw,320px);
  grid-template-rows:40px 1fr;
  grid-template-areas:"top top top" "left main right";}

/* ---------------------------------------------------------------- topbar */
#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:linear-gradient(180deg,#161c25,#10151d);border-bottom:1px solid var(--edge);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{font-weight:700;letter-spacing:.5px;color:var(--ink);flex:0 0 auto}
.brand small{color:var(--dim);font-weight:400;letter-spacing:0}
.sep{width:1px;height:22px;background:var(--edge2);flex:0 0 auto}
.spacer{flex:1 1 auto}

button{background:var(--panel2);border:1px solid var(--edge2);border-radius:4px;
  padding:5px 9px;cursor:pointer;color:var(--ink2);line-height:1;flex:0 0 auto}
button:hover{background:#232c39;color:var(--ink)}
button:active{transform:translateY(1px)}
button.on{background:var(--accent2);border-color:var(--accent);color:#eaf6fb}
button.fire{background:#7a2a22;border-color:#b4483a;color:#ffd9d2;font-weight:700;letter-spacing:1px;padding:6px 16px}
button.fire:hover{background:#94332a}
button:disabled{opacity:.35;cursor:default}
button.icon{min-width:30px;text-align:center;font-size:13px}

.readout{display:flex;flex-direction:column;line-height:1.15;flex:0 0 auto;padding:0 4px}
.readout b{font-size:12px;color:var(--ink);font-weight:600}
.readout span{font-size:9px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}

/* ------------------------------------------------------------- side rails */
aside{background:var(--panel);overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
aside::-webkit-scrollbar{width:8px}
aside::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:4px}
#left{grid-area:left;border-right:1px solid var(--edge)}
#right{grid-area:right;border-left:1px solid var(--edge)}

.panel{border-bottom:1px solid var(--edge)}
.panel>h3{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;
  background:#171d26;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--ink2);font-weight:600;position:sticky;top:0;z-index:2}
.panel>h3::before{content:"▾";font-size:9px;color:var(--dim);transition:transform .12s}
.panel.collapsed>h3::before{transform:rotate(-90deg)}
.panel.collapsed>.body{display:none}
.panel>h3 .tag{margin-left:auto;color:var(--dim);font-size:9px;letter-spacing:0;text-transform:none}
.body{padding:8px 10px 10px}

.row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;
  min-height:var(--row);padding:1px 0}
.row>label{color:var(--ink2);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.row .val{color:var(--ink);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;height:16px;accent-color:var(--accent);background:none}
.rowfull{display:block;padding:2px 0}
input[type=number],input[type=text],select{background:#0d1119;border:1px solid var(--edge2);
  border-radius:3px;padding:3px 5px;width:88px;text-align:right;font-variant-numeric:tabular-nums}
select{width:100%;text-align:left}
input:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.hint{color:var(--dim);font-size:10px;line-height:1.45;margin:4px 0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}

/* ------------------------------------------------------------------ main */
#main{grid-area:main;position:relative;background:var(--bg);display:flex;flex-direction:column;min-width:0}
#view{flex:1 1 auto;position:relative;min-height:0;touch-action:none}
canvas#viewport{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}

#hud{position:absolute;left:10px;top:10px;pointer-events:none;
  display:flex;flex-direction:column;gap:3px}
.chip{background:rgba(12,16,22,.82);border:1px solid var(--edge2);border-radius:3px;
  padding:3px 7px;font-size:10.5px;color:var(--ink2);pointer-events:auto;
  font-variant-numeric:tabular-nums;backdrop-filter:blur(3px)}
.chip b{color:var(--ink)}
.chip.alert{border-color:var(--danger);color:#ffd0c8}

#legend{position:absolute;right:10px;top:10px;background:rgba(12,16,22,.82);
  border:1px solid var(--edge2);border-radius:3px;padding:6px 8px;font-size:10px;color:var(--ink2);
  backdrop-filter:blur(3px);max-width:200px}
#legend .bar{height:8px;border-radius:2px;margin:4px 0 3px;
  background:linear-gradient(90deg,var(--l0),var(--l1),var(--l2),var(--l3),var(--l4))}
#legend .ends{display:flex;justify-content:space-between;color:var(--dim);font-size:9px}

/* ------------------------------------------------------------- transport */
#transport{flex:0 0 auto;border-top:1px solid var(--edge);background:#12171f;
  padding:5px 8px;display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#transport::-webkit-scrollbar{display:none}
#scrub{flex:1 1 220px;min-width:120px;accent-color:var(--accent);height:18px}
#tlabel{color:var(--dim);font-size:10px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------------ misc */
.layer{border:1px solid var(--edge2);border-radius:4px;margin-bottom:6px;background:#101620}
.layer.sel{border-color:var(--accent)}
.layer .lh{display:flex;align-items:center;gap:5px;padding:4px 6px;background:#161d27;cursor:pointer}
.layer .lh .sw{width:11px;height:11px;border-radius:2px;border:1px solid rgba(255,255,255,.2);flex:0 0 auto}
.layer .lh .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.layer .lh .th{color:var(--dim);font-size:10px}
.layer .lb{padding:5px 6px;display:none}
.layer.open .lb{display:block}
.mini{padding:2px 6px;font-size:10px}

table.kv{width:100%;border-collapse:collapse;font-size:11px}
table.kv td{padding:1.5px 0;vertical-align:top}
table.kv td:first-child{color:var(--ink2);padding-right:6px}
table.kv td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.kv tr.hi td:last-child{color:var(--accent)}
table.kv tr.bad td:last-child{color:var(--danger)}
table.kv tr.good td:last-child{color:var(--ok)}

#log{max-height:190px;overflow-y:auto;font-size:10.5px;line-height:1.5}
#log div{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.03);display:flex;gap:6px}
#log .t{color:var(--dim);flex:0 0 62px;text-align:right;font-variant-numeric:tabular-nums}
#log .s2{color:var(--warn)} #log .s3{color:var(--danger);font-weight:600}

.verdict{border-radius:4px;padding:7px 9px;margin-bottom:7px;border:1px solid var(--edge2);background:#101620}
.verdict.pen{border-color:#8e3a30;background:#1c1113}
.verdict.stop{border-color:#2f6a45;background:#0f1a14}
.verdict h4{font-size:13px;margin-bottom:2px}
.verdict p{color:var(--ink2);font-size:10.5px;line-height:1.4}

.note{font-size:10px;color:var(--dim);line-height:1.5;border-left:2px solid var(--edge2);padding-left:7px;margin:5px 0}
a{color:var(--accent)}

/* ----------------------------------------------------------- responsive */
#tabs{display:none;grid-area:top}
@media (max-width: 980px){
  #app{grid-template-columns:1fr;grid-template-rows:40px 32px 1fr;
    grid-template-areas:"top" "tabs" "main"}
  #tabs{display:flex;gap:4px;padding:4px 6px;background:#12171f;border-bottom:1px solid var(--edge);
    overflow-x:auto;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs button{flex:0 0 auto;font-size:11px}
  aside{position:fixed;left:0;right:0;bottom:0;top:112px;z-index:30;display:none;
    background:var(--panel);border:none}
  aside.show{display:block}
  #main{grid-area:main}
  .brand small{display:none}
  /* keep the field legend clear of the readout chips on a narrow screen */
  #legend{top:auto;bottom:10px;right:8px;max-width:150px;font-size:9px}
  #hud{max-width:calc(100% - 20px)}
  .chip{font-size:9.5px;padding:2px 5px}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">TERMINAL&nbsp;BALLISTICS <small>&nbsp;— deformable-armour sandbox</small></div>
    <div class="sep"></div>
    <button class="fire" id="btnFire">FIRE</button>
    <button class="icon" id="btnReset" title="Reset (R)">⟲</button>
    <div class="sep"></div>
    <button class="icon" id="btnPlay" title="Play / pause (space)">⏸</button>
    <button class="icon" id="btnStepB" title="Step back one frame (,)">⏴</button>
    <button class="icon" id="btnStepF" title="Step forward (.)">⏵</button>
    <button class="icon" id="btnStep10" title="Advance 10 solver steps">⏭</button>
    <div class="sep"></div>
    <div class="readout"><b id="roState">idle</b><span>state</span></div>
    <div class="readout"><b id="roTime">0 µs</b><span>sim time</span></div>
    <div class="readout"><b id="roDepth">—</b><span>depth</span></div>
    <div class="readout"><b id="roVres">—</b><span>residual v</span></div>
    <div class="readout"><b id="roNodes">—</b><span>nodes/bonds</span></div>
    <div class="readout"><b id="roPerf">—</b><span>solver ms</span></div>
    <div class="spacer"></div>
    <button id="btnDocs" title="Model assumptions">MODEL</button>
  </header>

  <nav id="tabs">
    <button data-panel="left" class="on">Setup</button>
    <button data-panel="right">Results</button>
    <button data-panel="none">Viewport</button>
  </nav>

  <aside id="left"></aside>

  <main id="main">
    <div id="view">
      <canvas id="viewport"></canvas>
      <div id="hud"></div>
      <div id="legend"></div>
    </div>
    <div id="transport">
      <button class="icon" id="btnFollow" title="Camera follow">⦿</button>
      <button class="icon" id="btnZoomIn">＋</button>
      <button class="icon" id="btnZoomOut">－</button>
      <button class="icon" id="btnFit" title="Fit target">⛶</button>
      <span id="tlabel">frame 0 / 0</span>
      <input type="range" id="scrub" min="0" max="0" value="0" step="1">
      <button class="mini" id="btnLive">LIVE</button>
    </div>
  </main>

  <aside id="right"></aside>
</div>

<script type="module">
  // ES modules need an http(s) origin. If this file was opened straight off
  // disk, say so plainly rather than failing silently.
  if (location.protocol === 'file:') {
    document.body.innerHTML = '<div style="padding:40px;max-width:640px;font-family:var(--mono);line-height:1.7">'
      + '<h2 style="margin-bottom:12px">Serve this over HTTP</h2>'
      + '<p style="color:#98a3b2">The simulator is built as ES modules, which browsers refuse to load from a <code>file://</code> URL.</p>'
      + '<p style="color:#98a3b2;margin-top:10px">From the repository root run:</p>'
      + '<pre style="background:#141922;padding:10px;border-radius:4px;margin:10px 0">python3 -m http.server 8080</pre>'
      + '<p style="color:#98a3b2">then open <a href="http://localhost:8080/">http://localhost:8080/</a>.</p>'
      + '<p style="color:#6d7787;margin-top:18px">A dependency-free single-file build is also available at '
      + '<code>dist/terminal-ballistics.html</code> — that one opens directly from disk.</p></div>';
  }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
