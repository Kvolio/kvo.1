<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0d12'/%3E%3Crect x='18' y='4' width='7' height='24' fill='%237d8798'/%3E%3Cpath d='M4 16 L13 12 L13 20 Z' fill='%23d8564a'/%3E%3C/svg%3E">
<meta name="description" content="Real-time peridynamic terminal-ballistics simulator: deformable armour, dynamic projectiles, penetration, spall and internal damage, all driven by the solver.">
<meta name="theme-color" content="#0a0d12">
<link rel="manifest" href="./manifest.webmanifest">
<!-- iOS home-screen install: black-translucent puts the app under the status
     bar, which the safe-area padding below already accounts for. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ballistics">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<title>Terminal Ballistics Sandbox — deformable armour / dynamic projectile simulation</title>
<style>
/* ======================================================================
   DESIGN SYSTEM
   Proportional type for the interface, monospace only where digits have to
   line up (readouts, inputs, report values, the log). Surfaces step up in
   lightness from the page to the panel to the card; borders are hairlines.
   ====================================================================== */
:root{
  --bg:#080b10; --bg2:#0d1117; --panel:#10151c; --panel2:#161c25; --card:#131921;
  --edge:#1f2731; --edge2:#2b3542; --edge3:#3a4656;
  --ink:#e4eaf1; --ink2:#a6b1bf; --dim:#6e7a8b;
  --accent:#49c1e4; --accent2:#1b6a86; --accentInk:#e8f8fd;
  --warn:#f0b24c; --danger:#e65a4c; --ok:#5ed08b;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --r:8px; --r2:6px; --row:30px;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
/* 100dvh tracks mobile Safari's collapsing URL bar; -webkit-fill-available is
   the fallback for older iOS that predates dvh units. */
html,body{height:100%;height:-webkit-fill-available;height:100dvh;
  overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:var(--ui);font-size:13px;line-height:1.35;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

#app{display:grid;height:100%;height:100dvh;
  grid-template-columns:var(--lw,300px) 1fr var(--rw,330px);
  grid-template-rows:48px 1fr;
  grid-template-areas:"top top top" "left main right";}

/* ---------------------------------------------------------------- top bar */
#top{grid-area:top;display:flex;align-items:center;gap:8px;
  padding:0 max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));
  background:linear-gradient(180deg,#121821,#0c1016);border-bottom:1px solid var(--edge);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--ink);flex:0 0 auto}
.brand::before{content:"";width:18px;height:18px;border-radius:5px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--danger) 0 34%,transparent 34%),linear-gradient(90deg,#26303d 0 58%,#8a95a6 58% 82%,#26303d 82%);
  box-shadow:0 0 0 1px var(--edge3) inset}
.brand small{color:var(--dim);font-weight:500;letter-spacing:0;font-size:12px}
.sep{width:1px;height:24px;background:var(--edge2);flex:0 0 auto;margin:0 2px}
.spacer{flex:1 1 auto}

button{background:var(--panel2);border:1px solid var(--edge2);border-radius:var(--r2);
  padding:6px 11px;cursor:pointer;color:var(--ink2);line-height:1.1;flex:0 0 auto;
  font-weight:500;transition:background .12s,border-color .12s,color .12s}
button:hover{background:#1f2733;color:var(--ink);border-color:var(--edge3)}
button:active{transform:translateY(1px)}
button.on{background:var(--accent2);border-color:var(--accent);color:var(--accentInk)}
button.fire{background:linear-gradient(180deg,#d4513f,#a83526);border-color:#ef7a68;color:#fff;
  font-weight:800;letter-spacing:.12em;padding:7px 20px;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 4px 14px rgba(230,90,76,.28)}
button.fire:hover{background:linear-gradient(180deg,#e05a47,#b33b2b);color:#fff}
button:disabled{opacity:.35;cursor:default}
button.icon{min-width:34px;text-align:center;font-size:14px;padding:6px 8px}

.readout{display:flex;flex-direction:column;line-height:1.15;flex:0 0 auto;padding:3px 9px;
  border-radius:var(--r2);background:rgba(255,255,255,.025);border:1px solid var(--edge)}
.readout b{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.readout span{font-size:9.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;font-weight:600}

/* --------------------------------------------------------------- columns */
aside{background:var(--panel);overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;padding:8px 8px calc(12px + env(safe-area-inset-bottom))}
aside::-webkit-scrollbar{width:8px}
aside::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:4px}
#left{grid-area:left;border-right:1px solid var(--edge)}
#right{grid-area:right;border-left:1px solid var(--edge)}

/* setup sections: what is fired / what it hits / how it is run */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;margin:2px 0 8px;
  background:var(--bg2);border:1px solid var(--edge);border-radius:calc(var(--r) + 2px);
  position:sticky;top:0;z-index:5}
.seg button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;
  background:transparent;border-color:transparent;border-radius:var(--r2);color:var(--ink2)}
.seg button b{font-size:13px;font-weight:700;color:inherit}
.seg button small{font-size:10px;color:var(--dim);font-weight:500}
.seg button.on{background:var(--panel2);border-color:var(--edge3);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on small{color:var(--accent)}
/* a row of choices inside a panel (playback speed): all on one line, not sticky */
.seg.choices{grid-template-columns:repeat(5,1fr);position:static;margin:0}
.seg.choices button{padding:6px 2px}
.seg.choices button b{font-size:11.5px}

/* panels are cards */
.panel{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.panel>h3{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);font-weight:700;
  background:linear-gradient(180deg,rgba(255,255,255,.025),transparent)}
.panel>h3::before{content:"";width:7px;height:7px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s;flex:0 0 auto}
.panel.collapsed>h3::before{transform:rotate(-45deg)}
.panel.collapsed>.body{display:none}
.panel>h3 .tag{margin-left:auto;color:var(--dim);font-size:11px;letter-spacing:0;text-transform:none;font-weight:500}
.body{padding:4px 12px 12px;border-top:1px solid var(--edge)}

.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;min-height:var(--row);padding:2px 0}
.row>label{color:var(--ink2);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.row .val{color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;height:18px;accent-color:var(--accent);background:none}
.row.stack{grid-template-columns:1fr;gap:4px;padding:4px 0 2px}
.row.stack>label{font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--dim)}
.rowfull{display:block;padding:2px 0}
input[type=number],input[type=text],select{background:var(--bg2);border:1px solid var(--edge2);
  border-radius:var(--r2);padding:5px 8px;width:96px;text-align:right;
  font-family:var(--mono);font-variant-numeric:tabular-nums;transition:border-color .12s}
input[type=text]{font-family:var(--ui);text-align:left}
select{width:100%;text-align:left;font-family:var(--ui);cursor:pointer}
input:hover,select:hover{border-color:var(--edge3)}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(73,193,228,.18)}
.hint{color:var(--dim);font-size:11px;line-height:1.5;margin:4px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.grid2+.grid4{margin-top:6px}
button.danger{color:#ffb3a8;border-color:#5a2a25}
button.danger:hover{background:#3a1814;color:#ffd5ce;border-color:var(--danger)}

/* -------------------------------------------------------------- viewport */
#main{grid-area:main;position:relative;background:radial-gradient(ellipse at 50% 40%,#0d1219,var(--bg) 70%);
  display:flex;flex-direction:column;min-width:0}
#view{flex:1 1 auto;position:relative;min-height:0;touch-action:none}
#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas#viewport{cursor:crosshair}
/* the upper layers are painted over the base but must not steal the pointer */
canvas#viewportField,canvas#viewportFx{pointer-events:none}

#hud{position:absolute;left:12px;top:12px;pointer-events:none;display:flex;flex-direction:column;gap:4px}
.chip{background:rgba(10,14,20,.78);border:1px solid var(--edge2);border-radius:var(--r2);
  padding:4px 9px;font-size:11.5px;color:var(--ink2);pointer-events:auto;font-family:var(--mono);
  font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.chip b{color:var(--ink);font-family:var(--ui);font-weight:700}
.chip.alert{border-color:var(--danger);color:#ffd5ce}

#legend{position:absolute;right:12px;top:12px;background:rgba(10,14,20,.78);
  border:1px solid var(--edge2);border-radius:var(--r);padding:8px 10px;font-size:11px;color:var(--ink2);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);max-width:210px}
#legend .bar{height:8px;border-radius:4px;margin:5px 0 4px;
  background:linear-gradient(90deg,var(--l0),var(--l1),var(--l2),var(--l3),var(--l4))}
#legend .ends{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;font-family:var(--mono)}

#transport{flex:0 0 auto;border-top:1px solid var(--edge);background:var(--panel);
  padding:7px max(10px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
  display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#transport::-webkit-scrollbar{display:none}
#scrub{flex:1 1 220px;min-width:120px;accent-color:var(--accent);height:20px}
#tlabel{color:var(--dim);font-size:11px;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ----------------------------------------------------------- layer cards */
.layer{border:1px solid var(--edge2);border-radius:var(--r2);margin-bottom:6px;background:var(--bg2);overflow:hidden;transition:border-color .12s}
.layer.sel{border-color:var(--accent);box-shadow:0 0 0 1px rgba(73,193,228,.25)}
.layer .lh{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);cursor:pointer}
.layer .lh:hover{background:#1c2430}
.layer .lh .sw{width:6px;height:22px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.layer .lh .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--ink)}
.layer .lh .th{color:var(--ink2);font-size:11px;font-family:var(--mono);white-space:nowrap}
.layer .lb{padding:8px 10px 10px;display:none;border-top:1px solid var(--edge)}
.layer.open .lb{display:block}
.mini{padding:4px 8px;font-size:11.5px}

table.kv{width:100%;border-collapse:collapse;font-size:12px}
table.kv td{padding:3px 0;vertical-align:top;border-bottom:1px solid rgba(255,255,255,.035)}
table.kv tr:last-child td{border-bottom:none}
table.kv td:first-child{color:var(--ink2);padding-right:8px}
table.kv td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
table.kv tr.hi td:last-child{color:var(--accent)}
table.kv tr.bad td:last-child{color:var(--danger)}
table.kv tr.good td:last-child{color:var(--ok)}
/* pinned-result comparison: three columns, the first row is the header */
table.cmp{margin-top:4px;table-layout:fixed}
table.cmp td{text-align:right;white-space:normal;word-break:break-word;font-size:11.5px}
table.cmp td:first-child{text-align:left;width:30%}
table.cmp tr:first-child td{color:var(--dim);font-family:var(--ui);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
table.cmp td.up{color:var(--danger)} table.cmp td.down{color:var(--ok)}

#log{max-height:220px;overflow-y:auto;font-size:11.5px;line-height:1.5}
#log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.035);display:flex;gap:8px}
#log .t{color:var(--dim);flex:0 0 64px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
#log .s2{color:var(--warn)} #log .s3{color:var(--danger);font-weight:600}

.verdict{border-radius:var(--r);padding:10px 12px;margin:8px 0;border:1px solid var(--edge2);background:var(--bg2)}
.verdict.pen{border-color:#93392e;background:linear-gradient(180deg,#24120f,#170d0c)}
.verdict.stop{border-color:#2d7049;background:linear-gradient(180deg,#0f2217,#0b1711)}
.verdict h4{font-size:15px;font-weight:800;margin-bottom:3px;letter-spacing:.01em}
.verdict p{color:var(--ink2);font-size:12px;line-height:1.45}

.note{font-size:11.5px;color:var(--ink2);line-height:1.55;border-left:2px solid var(--edge3);padding:1px 0 1px 9px;margin:6px 0}
a{color:var(--accent)}

/* ------------------------------------------------------------ responsive */
#tabs{display:none}
/* Touch: 40 px targets, and 16 px text in every field - iOS Safari zooms the
   whole page into any input set smaller than 16 px the moment it is tapped. */
@media (pointer: coarse){
  html,body{font-size:14px}
  button{min-height:40px;padding:9px 13px}
  button.icon{min-width:44px;font-size:16px}
  button.mini{min-height:34px}
  input[type=number],input[type=text],select{min-height:40px;font-size:16px;width:112px}
  select{width:100%}
  .row{min-height:44px}
  .row>label{font-size:13.5px}
  .row input[type=range]{height:32px}
  #scrub{height:32px}
  .layer .lh{padding:11px 10px}
  .panel>h3{padding:13px 12px;font-size:12px}
  .seg button{padding:9px 4px}
  .hint,.note{font-size:12.5px}
  table.kv{font-size:13px}
}

@media (max-width: 980px){
  #app{grid-template-columns:1fr;grid-template-rows:52px auto 1fr;grid-template-areas:"top" "tabs" "main"}
  #tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg2);
    border-bottom:1px solid var(--edge);padding:6px max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left))}
  #tabs button{font-size:14px;font-weight:600;background:transparent;border-color:transparent}
  #tabs button.on{background:var(--panel2);border-color:var(--edge3);color:var(--ink)}
  /* the HUD chips carry the live readouts, so the top bar keeps its width for controls */
  #top .readout,#top .sep{display:none}
  .brand{font-size:12px;letter-spacing:.04em}
  #legend{max-width:140px;font-size:9.5px;padding:5px 7px;opacity:.94}
  #legend .ends{font-size:9px}
  /* the columns share the viewport's grid cell instead of being positioned against
     a hard-coded header height, so notches and the URL bar cannot push them off-screen */
  #left,#right{grid-area:main;position:relative;z-index:30;display:none;border:none}
  #left.show,#right.show{display:block}
  #main{grid-area:main}
  .brand small{display:none}
  #legend{top:auto;bottom:10px;right:8px;max-width:150px;font-size:9.5px}
  #hud{max-width:calc(100% - 24px)}
  .chip{font-size:10.5px;padding:3px 7px}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">TERMINAL&nbsp;BALLISTICS <small>&nbsp;— deformable-armour sandbox</small></div>
    <div class="sep"></div>
    <button class="fire" id="btnFire">FIRE</button>
    <button class="icon" id="btnReset" title="Reset (R)">⟲</button>
    <div class="sep"></div>
    <button class="icon" id="btnPlay" title="Play / pause (space)">⏸</button>
    <button class="icon" id="btnStepB" title="Step back one frame (,)">⏴</button>
    <button class="icon" id="btnStepF" title="Step forward (.)">⏵</button>
    <button class="icon" id="btnStep10" title="Advance 10 solver steps">⏭</button>
    <div class="sep"></div>
    <div class="readout"><b id="roState">idle</b><span>state</span></div>
    <div class="readout"><b id="roTime">0 µs</b><span>sim time</span></div>
    <div class="readout"><b id="roDepth">—</b><span>depth</span></div>
    <div class="readout"><b id="roVres">—</b><span>residual v</span></div>
    <div class="readout"><b id="roNodes">—</b><span>nodes/bonds</span></div>
    <div class="readout"><b id="roPerf">—</b><span>solver ms</span></div>
    <div class="spacer"></div>
    <button id="btnDocs" title="Model assumptions">MODEL</button>
  </header>

  <nav id="tabs">
    <button data-panel="left" class="on">Setup</button>
    <button data-panel="right">Results</button>
    <button data-panel="none">Viewport</button>
  </nav>

  <aside id="left"></aside>

  <main id="main">
    <div id="view">
      <canvas id="viewport"></canvas>
      <canvas id="viewportField"></canvas>
      <canvas id="viewportFx"></canvas>
      <div id="hud"></div>
      <div id="legend"></div>
    </div>
    <div id="transport">
      <button class="icon" id="btnFollow" title="Camera follow">⦿</button>
      <button class="icon" id="btnZoomIn">＋</button>
      <button class="icon" id="btnZoomOut">－</button>
      <button class="icon" id="btnFit" title="Fit target">⛶</button>
      <span id="tlabel">frame 0 / 0</span>
      <input type="range" id="scrub" min="0" max="0" value="0" step="1">
      <button class="mini" id="btnLive">LIVE</button>
    </div>
  </main>

  <aside id="right"></aside>
</div>

<script type="module">
  // ES modules need an http(s) origin. If this file was opened straight off
  // disk, say so plainly rather than failing silently.
  if (location.protocol === 'file:') {
    document.body.innerHTML = '<div style="padding:40px;max-width:640px;font-family:var(--mono);line-height:1.7">'
      + '<h2 style="margin-bottom:12px">Serve this over HTTP</h2>'
      + '<p style="color:#98a3b2">The simulator is built as ES modules, which browsers refuse to load from a <code>file://</code> URL.</p>'
      + '<p style="color:#98a3b2;margin-top:10px">From the repository root run:</p>'
      + '<pre style="background:#141922;padding:10px;border-radius:4px;margin:10px 0">python3 -m http.server 8080</pre>'
      + '<p style="color:#98a3b2">then open <a href="http://localhost:8080/">http://localhost:8080/</a>.</p>'
      + '<p style="color:#6d7787;margin-top:18px">A dependency-free single-file build is also available at '
      + '<code>dist/terminal-ballistics.html</code> — that one opens directly from disk.</p></div>';
  }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
