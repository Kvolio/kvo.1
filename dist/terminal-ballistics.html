<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0d12'/%3E%3Crect x='18' y='4' width='7' height='24' fill='%237d8798'/%3E%3Cpath d='M4 16 L13 12 L13 20 Z' fill='%23d8564a'/%3E%3C/svg%3E">
<meta name="description" content="Real-time peridynamic terminal-ballistics simulator: deformable armour, dynamic projectiles, penetration, spall and internal damage, all driven by the solver.">
<meta name="theme-color" content="#0a0d12">
<link rel="manifest" href="./manifest.webmanifest">
<!-- iOS home-screen install: black-translucent puts the app under the status
     bar, which the safe-area padding below already accounts for. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ballistics">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<!-- single-file build: run tools/build.mjs to regenerate -->
<title>Terminal Ballistics Sandbox — deformable armour / dynamic projectile simulation</title>
<style>
:root{
  --bg:#0a0d12; --bg2:#11151c; --panel:#141922; --panel2:#1b212c;
  --edge:#252d3a; --edge2:#323b4b;
  --ink:#d6dde6; --ink2:#98a3b2; --dim:#6d7787;
  --accent:#4fb0d8; --accent2:#2b6f8c;
  --warn:#e0a23c; --danger:#d8564a; --ok:#5fbf7f;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --row:26px;
}
*{margin:0;padding:0;box-sizing:border-box}
/* 100dvh tracks mobile Safari's collapsing URL bar; the -webkit-fill-available
   line is the fallback for older iOS that predates dvh units. */
html,body{height:100%;height:-webkit-fill-available;height:100dvh;
  overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:var(--mono);font-size:12px;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;
  touch-action:manipulation}

#app{display:grid;height:100%;height:100dvh;
  grid-template-columns:var(--lw,280px) 1fr var(--rw,320px);
  grid-template-rows:40px 1fr;
  grid-template-areas:"top top top" "left main right";}

/* ---------------------------------------------------------------- topbar */
#top{grid-area:top;display:flex;align-items:center;gap:8px;
  padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));
  background:linear-gradient(180deg,#161c25,#10151d);border-bottom:1px solid var(--edge);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{font-weight:700;letter-spacing:.5px;color:var(--ink);flex:0 0 auto}
.brand small{color:var(--dim);font-weight:400;letter-spacing:0}
.sep{width:1px;height:22px;background:var(--edge2);flex:0 0 auto}
.spacer{flex:1 1 auto}

button{background:var(--panel2);border:1px solid var(--edge2);border-radius:4px;
  padding:5px 9px;cursor:pointer;color:var(--ink2);line-height:1;flex:0 0 auto}
button:hover{background:#232c39;color:var(--ink)}
button:active{transform:translateY(1px)}
button.on{background:var(--accent2);border-color:var(--accent);color:#eaf6fb}
button.fire{background:#7a2a22;border-color:#b4483a;color:#ffd9d2;font-weight:700;letter-spacing:1px;padding:6px 16px}
button.fire:hover{background:#94332a}
button:disabled{opacity:.35;cursor:default}
button.icon{min-width:30px;text-align:center;font-size:13px}

.readout{display:flex;flex-direction:column;line-height:1.15;flex:0 0 auto;padding:0 4px}
.readout b{font-size:12px;color:var(--ink);font-weight:600}
.readout span{font-size:9px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}

/* ------------------------------------------------------------- side rails */
aside{background:var(--panel);overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
aside::-webkit-scrollbar{width:8px}
aside::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:4px}
#left{grid-area:left;border-right:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}
#right{grid-area:right;border-left:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}

.panel{border-bottom:1px solid var(--edge)}
.panel>h3{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;
  background:#171d26;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--ink2);font-weight:600;position:sticky;top:0;z-index:2}
.panel>h3::before{content:"▾";font-size:9px;color:var(--dim);transition:transform .12s}
.panel.collapsed>h3::before{transform:rotate(-90deg)}
.panel.collapsed>.body{display:none}
.panel>h3 .tag{margin-left:auto;color:var(--dim);font-size:9px;letter-spacing:0;text-transform:none}
.body{padding:8px 10px 10px}

.row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;
  min-height:var(--row);padding:1px 0}
.row>label{color:var(--ink2);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.row .val{color:var(--ink);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;height:16px;accent-color:var(--accent);background:none}
.rowfull{display:block;padding:2px 0}
input[type=number],input[type=text],select{background:#0d1119;border:1px solid var(--edge2);
  border-radius:3px;padding:3px 5px;width:88px;text-align:right;font-variant-numeric:tabular-nums}
select{width:100%;text-align:left}
input:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.hint{color:var(--dim);font-size:10px;line-height:1.45;margin:4px 0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}

/* ------------------------------------------------------------------ main */
#main{grid-area:main;position:relative;background:var(--bg);display:flex;flex-direction:column;min-width:0}
#view{flex:1 1 auto;position:relative;min-height:0;touch-action:none}
#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas#viewport{cursor:crosshair}
/* the upper layers are painted over the base but must not steal the pointer:
   all gestures are handled on the base canvas */
canvas#viewportField,canvas#viewportFx{pointer-events:none}

#hud{position:absolute;left:10px;top:10px;pointer-events:none;
  display:flex;flex-direction:column;gap:3px}
.chip{background:rgba(12,16,22,.82);border:1px solid var(--edge2);border-radius:3px;
  padding:3px 7px;font-size:10.5px;color:var(--ink2);pointer-events:auto;
  font-variant-numeric:tabular-nums;backdrop-filter:blur(3px)}
.chip b{color:var(--ink)}
.chip.alert{border-color:var(--danger);color:#ffd0c8}

#legend{position:absolute;right:10px;top:10px;background:rgba(12,16,22,.82);
  border:1px solid var(--edge2);border-radius:3px;padding:6px 8px;font-size:10px;color:var(--ink2);
  backdrop-filter:blur(3px);max-width:200px}
#legend .bar{height:8px;border-radius:2px;margin:4px 0 3px;
  background:linear-gradient(90deg,var(--l0),var(--l1),var(--l2),var(--l3),var(--l4))}
#legend .ends{display:flex;justify-content:space-between;color:var(--dim);font-size:9px}

/* ------------------------------------------------------------- transport */
#transport{flex:0 0 auto;border-top:1px solid var(--edge);background:#12171f;
  padding:5px max(8px,env(safe-area-inset-right)) max(5px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#transport::-webkit-scrollbar{display:none}
#scrub{flex:1 1 220px;min-width:120px;accent-color:var(--accent);height:18px}
#tlabel{color:var(--dim);font-size:10px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------------ misc */
.layer{border:1px solid var(--edge2);border-radius:4px;margin-bottom:6px;background:#101620}
.layer.sel{border-color:var(--accent)}
.layer .lh{display:flex;align-items:center;gap:5px;padding:4px 6px;background:#161d27;cursor:pointer}
.layer .lh .sw{width:11px;height:11px;border-radius:2px;border:1px solid rgba(255,255,255,.2);flex:0 0 auto}
.layer .lh .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.layer .lh .th{color:var(--dim);font-size:10px}
.layer .lb{padding:5px 6px;display:none}
.layer.open .lb{display:block}
.mini{padding:2px 6px;font-size:10px}

table.kv{width:100%;border-collapse:collapse;font-size:11px}
table.kv td{padding:1.5px 0;vertical-align:top}
table.kv td:first-child{color:var(--ink2);padding-right:6px}
table.kv td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.kv tr.hi td:last-child{color:var(--accent)}
table.kv tr.bad td:last-child{color:var(--danger)}
table.kv tr.good td:last-child{color:var(--ok)}

#log{max-height:190px;overflow-y:auto;font-size:10.5px;line-height:1.5}
#log div{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.03);display:flex;gap:6px}
#log .t{color:var(--dim);flex:0 0 62px;text-align:right;font-variant-numeric:tabular-nums}
#log .s2{color:var(--warn)} #log .s3{color:var(--danger);font-weight:600}

.verdict{border-radius:4px;padding:7px 9px;margin-bottom:7px;border:1px solid var(--edge2);background:#101620}
.verdict.pen{border-color:#8e3a30;background:#1c1113}
.verdict.stop{border-color:#2f6a45;background:#0f1a14}
.verdict h4{font-size:13px;margin-bottom:2px}
.verdict p{color:var(--ink2);font-size:10.5px;line-height:1.4}

.note{font-size:10px;color:var(--dim);line-height:1.5;border-left:2px solid var(--edge2);padding-left:7px;margin:5px 0}
a{color:var(--accent)}

/* ----------------------------------------------------------- responsive */
/* assigned to its own row only in the mobile layout below; on desktop it is
   not rendered at all */
#tabs{display:none}
/* Coarse pointers get larger hit targets: 36 px is the smallest control that
   is comfortably tappable, and it keeps the dense engineering layout usable
   without changing any of it. */
@media (pointer: coarse){
  button{min-height:36px;padding:8px 12px}
  button.icon{min-width:42px;font-size:15px}
  button.mini{min-height:30px}
  input[type=number],input[type=text],select{min-height:34px;font-size:13px}
  .row input[type=range]{height:30px}
  #scrub{height:30px}
  .layer .lh{padding:9px 8px}
  .panel>h3{padding:11px 10px}
}

@media (max-width: 980px){
  #app{grid-template-columns:1fr;grid-template-rows:44px auto 1fr;
    grid-template-areas:"top" "tabs" "main"}
  #tabs{grid-area:tabs;display:flex;gap:4px;background:#12171f;border-bottom:1px solid var(--edge);
    padding:4px max(6px,env(safe-area-inset-right)) 4px max(6px,env(safe-area-inset-left));
    overflow-x:auto;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs button{flex:0 0 auto;font-size:12px}
  /* the HUD chips already carry the live readouts, so the top bar gives its
     width to the controls instead */
  #top .readout,#top .sep{display:none}
  .brand{font-size:11px;letter-spacing:0}
  #legend{max-width:132px;font-size:8.5px;padding:4px 6px;opacity:.92}
  #legend .ends{font-size:8px}
  /* the rails share the viewport's grid cell instead of being positioned
     against a hard-coded header height, so notches and the dynamic URL bar
     cannot push them off-screen */
  /* the id selectors in the desktop layout outrank a bare `aside` rule, so the
     override has to match their specificity */
  #left,#right{grid-area:main;position:relative;z-index:30;display:none;border:none}
  #left.show,#right.show{display:block}
  #main{grid-area:main}
  .brand small{display:none}
  /* keep the field legend clear of the readout chips on a narrow screen */
  #legend{top:auto;bottom:10px;right:8px;max-width:150px;font-size:9px}
  #hud{max-width:calc(100% - 20px)}
  .chip{font-size:9.5px;padding:2px 5px}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">TERMINAL&nbsp;BALLISTICS <small>&nbsp;— deformable-armour sandbox</small></div>
    <div class="sep"></div>
    <button class="fire" id="btnFire">FIRE</button>
    <button class="icon" id="btnReset" title="Reset (R)">⟲</button>
    <div class="sep"></div>
    <button class="icon" id="btnPlay" title="Play / pause (space)">⏸</button>
    <button class="icon" id="btnStepB" title="Step back one frame (,)">⏴</button>
    <button class="icon" id="btnStepF" title="Step forward (.)">⏵</button>
    <button class="icon" id="btnStep10" title="Advance 10 solver steps">⏭</button>
    <div class="sep"></div>
    <div class="readout"><b id="roState">idle</b><span>state</span></div>
    <div class="readout"><b id="roTime">0 µs</b><span>sim time</span></div>
    <div class="readout"><b id="roDepth">—</b><span>depth</span></div>
    <div class="readout"><b id="roVres">—</b><span>residual v</span></div>
    <div class="readout"><b id="roNodes">—</b><span>nodes/bonds</span></div>
    <div class="readout"><b id="roPerf">—</b><span>solver ms</span></div>
    <div class="spacer"></div>
    <button id="btnDocs" title="Model assumptions">MODEL</button>
  </header>

  <nav id="tabs">
    <button data-panel="left" class="on">Setup</button>
    <button data-panel="right">Results</button>
    <button data-panel="none">Viewport</button>
  </nav>

  <aside id="left"></aside>

  <main id="main">
    <div id="view">
      <canvas id="viewport"></canvas>
      <canvas id="viewportField"></canvas>
      <canvas id="viewportFx"></canvas>
      <div id="hud"></div>
      <div id="legend"></div>
    </div>
    <div id="transport">
      <button class="icon" id="btnFollow" title="Camera follow">⦿</button>
      <button class="icon" id="btnZoomIn">＋</button>
      <button class="icon" id="btnZoomOut">－</button>
      <button class="icon" id="btnFit" title="Fit target">⛶</button>
      <span id="tlabel">frame 0 / 0</span>
      <input type="range" id="scrub" min="0" max="0" value="0" step="1">
      <button class="mini" id="btnLive">LIVE</button>
    </div>
  </main>

  <aside id="right"></aside>
</div>

__def("src/sim/pd/domain.js", function (__exports, __req) {
/**
 * PERIDYNAMIC DOMAIN
 * ==================
 *
 * Holds the discretised deformable bodies: a structure-of-arrays particle set
 * plus a flat bond list, both in typed arrays so the force loop stays in the
 * JIT's fast path.
 *
 * DISCRETISATION
 * --------------
 * A uniform lattice is laid out in the *shot frame*: axis `a` along the
 * projectile velocity at the moment the domain is created, axis `b`
 * perpendicular to it. Only the corridor the projectile can actually reach is
 * meshed; armour outside that corridor is drawn as static geometry and its
 * mechanical role is represented by the boundary treatment at the corridor
 * edges. This is a "domain of interest" reduction — it is what makes a
 * research-style continuum model run at interactive rates in a browser — and
 * it is documented as assumption A4 in docs/MODEL.md.
 *
 * Lattice sites are jittered by a few percent of the spacing. A perfectly
 * regular peridynamic lattice biases crack paths along the lattice axes; the
 * jitter breaks that symmetry. Bonds are built from the jittered reference
 * configuration, so the initial state is exactly force-free.
 *
 * BONDS
 * -----
 * A bond exists between two sites of the same `bondGroup` whose reference
 * separation is below the horizon. Bonds are never deleted: a broken bond
 * stops carrying tension and becomes a contact pair instead, which is both
 * cheaper and more correct than removing it (crater walls, channel walls and
 * comminuted material still push on each other).
 */

const { makeRng, weibullFactor, clamp, pointInPoly, polyBounds } = __req("src/core/math.js");
const { derivePD, bondPair, stableDt, flowStress } = __req("src/materials/derive.js");
const { sampleGradient } = __req("src/materials/database.js");

const ROLE = {
  ARMOUR: 0,
  PENETRATOR: 1,
  PROJ_AUX: 2,   // caps, windscreens, sabot petals, casing
  FILLER: 3,     // explosive fill
  MODULE: 4,     // internal component that was meshed

    this.dampQuad = opts.dampQuad ?? 1;

    // OUT-OF-PLANE CONFINEMENT (2-D -> 3-D correction)
    // Opening a cavity in a plane-strain slice only requires material to flow
    // sideways in the plane. Opening the same cavity in a real plate requires
    // it to flow radially in two directions against the hoop stress of the
    // surrounding material, which costs more work. Without a correction, a 2-D
    // section systematically under-predicts the resistance of a deep channel.
    // The correction is applied as extra stiffness against *compressive*
    // dilatation only, so it changes cavity expansion without changing the
    // tensile/spall response. It is a calibration factor, not a derivation:
    // it is exposed in the UI and documented in MODEL.md §3.6.
    this.confinement = opts.confinement ?? TUNE.confinement;
    this.compDuct = TUNE.compDuct;
    this.triax = TUNE.triax;
    this.triaxMax = TUNE.triaxMax;

    // contact stiffness also constrains the time step
    const dtC = 0.22 * 2 * Math.sqrt(ratio);
    this.dt = Math.min(this.dt, dtC);
    this.dtBase = this.dt;
    this.dt = Math.min(this.dt, this.velocityLimitedDt());

    // Per-bond contact distance for pairs that have already failed. A bond
    // that breaks under compression is sitting at r < dcContact, so switching
    // it to the shared penalty law would apply kC*(dcContact - r) as a step
    // change: measured at 200x the force the bond was carrying, up to 358x,
    // delivered to a whole row of pairs in the same step under a blunt cap.
    // The pair is already compacted; contact must resist FURTHER approach, not
    // violently undo the compaction. Latching the reference to the separation
    // at the moment of failure makes the force continuous through the
    // transition and still blocks interpenetration from there on.
    this.bdc = new Float32Array(domain.nb);
    this.bdc.fill(this.dcContact);
    this.isoAcc = new Float64Array(domain.n);
    this.bstretch = new Float32Array(domain.nb);
    this.bse = new Float32Array(domain.nb);
    this.energy = { plastic: 0, fracture: 0, damping: 0, contact: 0, iso: 0 };
    // Energy audit. An explicit scheme with penalty contact and rate-dependent
    // plasticity is not exactly conservative; rather than hide that, the drift
    // is measured every step and reported in the diagnostics panel.
    this.E0 = null;
    this.brokenThisStep = 0;
    this.totalBroken = 0;
    this.maxContactForce = 0;
    this.computeForces();
    this.E0 = this.kinetic() + this.strainEnergy();
  }

  /** Active contact queries and the full set of live collision targets. */
  refreshContactSet() {
    const d = this.d;
    let k = 0, targets = 0;
    for (let i = 0; i < d.n; i++) {
      this.contactMask[i] = 0;
      if (!d.alive[i]) continue;
      this.contactTargets[targets++] = i;
      if ((d.flags[i] & 1) || d.damage[i] > 0.02 || (d.flags[i] & 8)) {
        this.contactSet[k++] = i;
        this.contactMask[i] = 1;
      }
    }
    this.contactCount = k;
    this.contactTargetCount = targets;
  }

  /**
   * Velocity CFL. The stiffness bounds keep the scheme STABLE; they say
   * nothing about whether a fast event is RESOLVED. A shaped-charge jet at
   * 8 km/s crosses half a lattice spacing in a 196 ns step, and its interaction
   * with a plate sweeping across it is then smeared over too few steps to come
   * out right - measured by an ERA cassette flipping from beating an inert one
   * to losing to it purely on the step size. Limiting how far the fastest node
   * may travel per step fixes that where it matters and costs nothing
   * elsewhere: at 800 m/s the limit is far above the stiffness bound and never
   * binds, so ordinary shot keeps the larger step.
   */
  velocityLimitedDt() {
    const d = this.d;
    let v2 = 0;
    for (let i = 0; i < d.n; i++) {
      if (!d.alive[i]) continue;
      const q = d.vx[i] * d.vx[i] + d.vy[i] * d.vy[i];
      if (q > v2) v2 = q;
    }
    const v = Math.sqrt(v2);
    return v > 1 ? (CFL_TRAVEL * d.dx) / v : Infinity;
  }

  /** One explicit step. Returns the time advanced. */
  step(dt = this.dt) {
    const d = this.d;
    const n = d.n;
    const px = d.px, py = d.py, vx = d.vx, vy = d.vy, fx = d.fx, fy = d.fy, invM = d.invM;
    const alive = d.alive;
    const half = 0.5 * dt;

    // --- half kick with the force from the end of the previous step -------
    for (let i = 0; i < n; i++) {
      if (!alive[i]) continue;
      vx[i] += fx[i] * invM[i] * half;
      vy[i] += fy[i] * invM[i] * half;
    }
    this.applyConstraints(dt);
    // --- drift ------------------------------------------------------------
    for (let i = 0; i < n; i++) { if (alive[i]) { px[i] += vx[i] * dt; py[i] += vy[i] * dt; } }

    // --- new forces -------------------------------------------------------
    this.computeForces(dt);

    // --- half kick --------------------------------------------------------
    for (let i = 0; i < n; i++) {
      if (!alive[i]) continue;
      vx[i] += fx[i] * invM[i] * half;
      vy[i] += fy[i] * invM[i] * half;
    }
    this.applyConstraints(dt);

    this.time += dt;
    this.steps++;
    // re-evaluated periodically: the fastest thing in the domain changes as a
    // jet forms, a plate is thrown, or the event decays
    if (this.steps % 8 === 0) this.dt = Math.min(this.dtBase, this.velocityLimitedDt());
    if (this.steps % 4 === 0) this.updateFlowFactors();
    return dt;
  }

  applyConstraints(dt) {
    const d = this.d, n = d.n;
    for (let i = 0; i < n; i++) {
      if (!d.alive[i]) { d.vx[i] = 0; d.vy[i] = 0; continue; }
      const fl = d.flags[i];
      if (fl & 4) { d.vx[i] = 0; d.vy[i] = 0; continue; }
      if (fl & 2) {
        const k = 1 / (1 + d.bcRate[i] * dt);
        d.vx[i] *= k; d.vy[i] *= k;
      }
    }
  }

  /** Johnson-Cook multiplier per particle, refreshed every few steps. */
  updateFlowFactors() {
    const d = this.d;
    for (let i = 0; i < d.n; i++) {
      if (!d.alive[i]) continue;
      const pd = d.matTable[d.matIndex[i]].pd;
      let f = 1;
      const edot = d.srate[i];
      if (pd.jcC > 0 && edot > 1) f += pd.jcC * Math.log(edot);
      const Tstar = clamp((d.temp[i] - 293) / (pd.Tm - 293), 0, 1);
      if (Tstar > 0) f *= Math.max(0.03, 1 - Math.pow(Tstar, pd.jcM));
      d.flowMul[i] = f;
      d.srate[i] *= 0.5;   // decay the accumulator
    }
  }

  computeForces(dt = this.dt) {
    const d = this.d;
    const n = d.n, nb = d.nb;
    const px = d.px, py = d.py, vx = d.vx, vy = d.vy;
    const fx = d.fx, fy = d.fy;
    const bi = d.bi, bj = d.bj, bk = d.bk, bref = d.bref, bsp = d.bsp;
    const bsy = d.bsy, bsf = d.bsf, bsten = d.bsten, bstate = d.bstate;
    const theta = d.theta, thetaAcc = d.thetaAcc;
    const bstretch = this.bstretch, bse = this.bse;
    const plStrain = d.plStrain;
    const bdamp = d.bdamp, bdampQ = d.bdampQ, bcrit = d.bcrit;
    const mass = d.mass, temp = d.temp, flowMul = d.flowMul, srate = d.srate;
    const virial = d.virial, damage = d.damage, nBroken = d.nBroken, nBond0 = d.nBond0;
    const flags = d.flags, alive = d.alive;

    fx.fill(0); fy.fill(0); virial.fill(0);

    // ---- pass 1: local dilatation ---------------------------------------
    // theta_i sums the stretch of the bonds still attached to node i and
    // divides by the node's ORIGINAL bond count (see below). For uniform
    // dilatation of undamaged material every bond stretches equally and theta
    // recovers the volumetric strain; for pure shear the stretches cancel.
    // It must be evaluated at the *current* configuration: lagging it by even
    // one step couples the stiffest (hydrostatic) mode to a delayed force and
    // drives an explicit instability that no realistic time step survives.
    thetaAcc.fill(0);
    for (let b = 0; b < nb; b++) {
      if (bstate[b] !== BOND.INTACT) continue;
      const i = bi[b], j = bj[b];
      if (!alive[i] || !alive[j]) continue;
      const dx = px[j] - px[i], dy = py[j] - py[i];
      const r0 = bref[b];
      const st = (Math.sqrt(dx * dx + dy * dy) - r0) / r0;
      bstretch[b] = st;
      thetaAcc[i] += st; thetaAcc[j] += st;
    }
    // Normalised by the node's ORIGINAL bond count, not by the number still
    // intact. Re-averaging over the surviving bonds makes theta jump every
    // time one fails - the failing bond is by definition the most stretched of
    // the set, so dropping it re-scales the mean discontinuously, and every
    // other bond on that node sees its isotropic force step. Integrated
    // explicitly, those steps are work done with no displacement: with
    // breaking suppressed the same impact conserves energy to 1 %, with it
    // enabled the model gained 150 % on a blunt-capped AP round.
    // A fixed denominator also states the right physics: a node that has lost
    // most of its bonds is comminuted, and its ability to carry hydrostatic
    // stress should fall with the damage rather than persist undiminished
    // down to the last surviving bond.
    for (let i = 0; i < n; i++) theta[i] = nBond0[i] > 0 ? thetaAcc[i] / nBond0[i] : 0;

    let ePlast = 0, eFrac = 0, eDamp = 0;
    let broken = 0;
    const kNode = this.kNode, zetaC = this.contactZeta;
    const dLin = this.dampLin, dQuad = this.dampQuad, conf = this.confinement;
    const dC = this.dcContact;
    const mu = this.friction;
    const invDt = dt > 0 ? 1 / dt : 0;

    // ---- pass 2: constitutive update and the nonlocal reaction ------------
    // The bond force is the gradient of a potential written over the whole
    // neighbourhood:
    //
    //   U = SUM_b  r0_b * bk_b * [ 0.5*sIso_b^2 + 0.5*se_b^2 + phi(sIso_b) ]
    //
    //   sIso_b = 0.5*(theta_i + theta_j)      neighbourhood dilatation
    //   se_b   = clamp(s_b - sIso_b - sp_b)   deviatoric elastic stretch
    //   phi'   = the tension cap and the confinement factor
    //
    // sIso_b is a NODE-AVERAGED quantity, so U depends on bond b's stretch
    // both directly and through every other bond attached to i or j. The
    // original code differentiated only the direct path: bond (i,j) felt a
    // force from its neighbours' stretches while those neighbours felt no
    // reaction. That force field is not the gradient of anything, so it is
    // path-dependent and does net work around a closed loop - it was the
    // dominant energy source in the model, contributing +6.9 MJ of bond work
    // on a 1.27 MJ impact for a blunt-capped AP round and throwing armour
    // nodes out at four times the striking velocity.
    //
    // Differentiating U properly, with d(theta_i)/d(s_b) = 1/cnt_i:
    //
    //   dU/ds_c = r0_c bk_c se_c + Acc_i + Acc_j
    //   Acc_i   = (0.5/cnt_i) SUM_{b at i} r0_b bk_b [ sIso_b + phi'(sIso_b) - se_b ]
    //
    // and F_c = (1/r0_c) dU/ds_c because virtual work is F * r0 * ds. In the
    // interior of a uniform lattice this reproduces the bond-based force
    // F = bk*(s - sp) exactly, so the calibration of `confinement` is
    // unchanged; it differs where the bond counts differ - at free surfaces
    // and in heavily damaged material - which is precisely where the old form
    // was manufacturing energy.
    const isoAcc = this.isoAcc, bdc = this.bdc;
    isoAcc.fill(0);
    let uIso = 0;
    for (let b = 0; b < nb; b++) {
      if (bstate[b] !== BOND.INTACT) continue;
      const i = bi[b], j = bj[b];
      if (!alive[i] || !alive[j]) continue;
      const r0 = bref[b];
      const s = bstretch[b];

      // VOLUMETRIC / DEVIATORIC SPLIT
      // Plastic flow is deviatoric. Capping the whole bond stretch at yield
      // would also cap the hydrostatic response, leaving the material with no
      // bulk modulus above ~1 GPa - it would behave like a pressure-limited
      // fluid under the impact shock, dissipate the entire shock as "plastic
      // work", heat itself past its melting point and disintegrate. The
      // isotropic part is therefore always elastic and only the deviatoric
      // remainder can yield.
      let sIso = 0.5 * (theta[i] + theta[j]);
      if (sIso < -1) sIso = -1;
      // The deviatoric remainder is measured against the RAW dilatation so a
      // uniform deformation (every bond at s == theta) gives sDev == 0
      // identically. The cap and the confinement factor act through phi below
      // and must not leak into this subtraction: doing so relabels part of the
      // hydrostatic strain as deviatoric, and under the shock of a blunt
      // impact that manufactured deviatoric strain flows plastically. At 2 %
      // uniform compression the old form invented a deviatoric stretch of six
      // times yield, which heated and softened the material.
      let sp = bsp[b];
      let se = s - sIso - sp;
      const sy = bsy[b] * 0.5 * (flowMul[i] + flowMul[j]);

      if (se > sy || se < -sy) {
        const dsp = se > sy ? se - sy : se + sy;
        sp += dsp; se = se > 0 ? sy : -sy;
        const w = Math.abs(dsp) * r0 * Math.abs(bk[b] * sy);
        ePlast += w;
        const hw = 0.5 * w;
        temp[i] += hw / (mass[i] * d.matTable[d.matIndex[i]].pd.cp);
        temp[j] += hw / (mass[j] * d.matTable[d.matIndex[j]].pd.cp);
        bsp[b] = sp;
        const dpe = Math.abs(dsp) * 0.5;
        plStrain[i] += dpe; plStrain[j] += dpe;
      }

      // --- failure --------------------------------------------------------
      // tension: total stretch reaches the measured failure strain
      // shear/compression: accumulated *plastic* stretch exhausts the
      //   ductility. Using the accumulated plastic variable rather than the
      //   instantaneous deviatoric stretch matters: in a heavily damaged
      //   region the local dilatation is estimated from a shrinking, biased
      //   set of surviving bonds, so the instantaneous split is noisy and
      //   feeds back into more breakage. The plastic accumulator is monotonic
      //   and does not.
      // Pressure raises the strain a ductile metal survives (see tuning.js). The
      // factor is 1 in tension and under no pressure, so ceramics - which fail
      // elastically, far below yield - are unaffected.
      let sfe = bsf[b];
      if (this.triax > 0 && sIso < 0) {
        const sigStar = 0.76 * (-sIso / Math.max(bsy[b], 1e-6));
        sfe *= Math.min(Math.exp(this.triax * sigStar), this.triaxMax);
      }
      if (s >= sfe || Math.abs(sp) >= sfe * this.compDuct) {
        bstate[b] = BOND.BROKEN;
        nBroken[i]++; nBroken[j]++;
        damage[i] = nBroken[i] / (nBond0[i] || 1);
        damage[j] = nBroken[j] / (nBond0[j] || 1);
        if (damage[i] >= 0.96 && !(flags[i] & 8)) flags[i] |= 8;
        if (damage[j] >= 0.96 && !(flags[j] & 8)) flags[j] |= 8;
        const rBreak = r0 * (1 + s);
        if (rBreak < dC) bdc[b] = rBreak;
        // the whole stored potential of this bond is released, including its
        // share of the dilatational term, which otherwise just vanishes from U
        let phiB = 0;
        if (sIso < 0) phiB = 0.5 * (conf - 1) * sIso * sIso;
        else if (sIso > bsten[b]) { const e = sIso - bsten[b]; phiB = -0.5 * e * e; }
        eFrac += r0 * bk[b] * (0.5 * se * se + 0.5 * sIso * sIso + phiB);
        broken++;
        continue;
      }
      if (bcrit[b] < s) bcrit[b] = s;
      bse[b] = se;

      // phi'(x) = (conf-1)x for x<0 ; 0 for 0 <= x <= sTen ; sTen-x for x>sTen
      const stn = bsten[b];
      let dphi = 0, phi = 0;
      if (sIso < 0) { dphi = (conf - 1) * sIso; phi = 0.5 * (conf - 1) * sIso * sIso; }
      else if (sIso > stn) { const e = sIso - stn; dphi = -e; phi = -0.5 * e * e; }
      const w = r0 * bk[b];
      uIso += w * (phi + 0.5 * sIso * sIso);
      const g = w * (sIso + dphi - se) * 0.5;
      isoAcc[i] += g / nBond0[i];
      isoAcc[j] += g / nBond0[j];
    }
    this.energy.iso = uIso;

    // ------------------------------------------------------------- bonds --
    for (let b = 0; b < nb; b++) {
      const i = bi[b], j = bj[b];
      if (!alive[i] || !alive[j]) continue;
      const dx = px[j] - px[i], dy = py[j] - py[i];
      let r = Math.sqrt(dx * dx + dy * dy);
      if (r < 1e-12) r = 1e-12;
      const ex = dx / r, ey = dy / r;
      const dvx = vx[j] - vx[i], dvy = vy[j] - vy[i];
      const vn = dvx * ex + dvy * ey;

      if (bstate[b] === BOND.INTACT) {
        const r0 = bref[b];
        const sdot = Math.abs(vn) / r0;
        srate[i] += sdot; srate[j] += sdot;

        // Constitutive state was resolved in pass 2; this is the gradient of
        // the neighbourhood potential written out as a pair force.
        const F = bk[b] * bse[b] + (isoAcc[i] + isoAcc[j]) / r0;
        // Kelvin-Voigt damping plus a compression-only shock viscosity.
        // Sign convention for this bond: positive = tension (pulls i toward
        // j), so a damper resisting approach (vn < 0) must be negative.
        let Fd = bdamp[b] * dLin * vn;
        if (vn < 0) Fd -= bdampQ[b] * dQuad * vn * vn;
        eDamp += Math.abs(Fd * vn) * dt;
        const Ft = F + Fd;
        fx[i] += Ft * ex; fy[i] += Ft * ey;
        fx[j] -= Ft * ex; fy[j] -= Ft * ey;
        const vir = F * r * 0.5;
        virial[i] += vir; virial[j] += vir;
      } else {
        // ---- broken bond acting as a contact pair ------------------------
        const dCb = bdc[b];
        if (r < dCb) {
          const meff = (mass[i] * mass[j]) / (mass[i] + mass[j]);
          const kC = (2 * kNode[i] * kNode[j]) / (kNode[i] + kNode[j]);
          const pen = dCb - r;
          let Fn = kC * pen;                        // magnitude, repulsive
          // Damping ramped in with overlap. Applied as a step at first touch it
          // is a force discontinuity, and a flat-faced impact brings a whole
          // row of nodes across that discontinuity in the same time step - a
          // synchronised impulse that pumps energy into the lattice.
          if (vn < 0) Fn += RAMP(pen, dCb) * 2 * zetaC * Math.sqrt(kC * meff) * -vn;
          fx[i] -= Fn * ex; fy[i] -= Fn * ey;
          fx[j] += Fn * ex; fy[j] += Fn * ey;
          // Coulomb friction along the contact tangent, capped so a single
          // step can never reverse the relative tangential motion
          const vtx = dvx - vn * ex, vty = dvy - vn * ey;
          const vt = Math.hypot(vtx, vty);
          if (vt > 1e-6) {
            const s = Math.min(mu * Fn, meff * vt * invDt * 0.5) / vt;
            fx[i] += s * vtx; fy[i] += s * vty;
            fx[j] -= s * vtx; fy[j] -= s * vty;
          }
          virial[i] -= Fn * r * 0.5; virial[j] -= Fn * r * 0.5;
        }
      }
    }

    // ------------------------------------------------- non-neighbour contact
    // Bond failure above can expose nodes in this very force evaluation.
    this.refreshContactSet();
    const cs = this.contactSet, cn = this.contactCount;
    if (cn > 0 && this.contactTargetCount > 1) {
      this.grid.cell = dC * 1.02;
      // Surface/damaged/free nodes initiate queries, but intact interior nodes
      // must still receive them. Filtering BOTH sides made the interior of a
      // solid invisible to loose particles once they got past its surface.
      this.grid.build(px, py, n, this.contactTargets.subarray(0, this.contactTargetCount));
      const near = this.near;
      const deltaCut = d.delta + d.dx * 0.5;
      let maxF = 0;
      for (let q = 0; q < cn; q++) {
        const i = cs[q];
        const cnt = this.grid.query(px[i], py[i], dC, near);
        for (let z = 0; z < cnt; z++) {
          const j = near[z];
          // An inactive target never initiates a query of its own. Index order
          // can only suppress duplicates when BOTH members are active.
          if (j === i || (j < i && this.contactMask[j])) continue;
          // skip reference neighbours - already handled by the bond list
          if (d.group[i] === d.group[j]) {
            const rdx = d.rx[j] - d.rx[i], rdy = d.ry[j] - d.ry[i];
            if (rdx * rdx + rdy * rdy <= deltaCut * deltaCut) continue;
          }
          const dx = px[j] - px[i], dy = py[j] - py[i];
          let r = Math.sqrt(dx * dx + dy * dy);
          if (r >= dC || r < 1e-12) continue;
          const ex = dx / r, ey = dy / r;
          const dvx = vx[j] - vx[i], dvy = vy[j] - vy[i];
          const vn = dvx * ex + dvy * ey;
          const pen = dC - r;
          const meff = (mass[i] * mass[j]) / (mass[i] + mass[j]);
          const kC = (2 * kNode[i] * kNode[j]) / (kNode[i] + kNode[j]);
          let Fn = kC * pen;
          if (vn < 0) Fn += RAMP(pen, dC) * 2 * zetaC * Math.sqrt(kC * meff) * -vn;
          if (Fn > maxF) maxF = Fn;
          fx[i] -= Fn * ex; fy[i] -= Fn * ey;
          fx[j] += Fn * ex; fy[j] += Fn * ey;
          const vtx = dvx - vn * ex, vty = dvy - vn * ey;
          const vt = Math.hypot(vtx, vty);
          if (vt > 1e-6) {
            const s = Math.min(mu * Fn, meff * vt * invDt * 0.5) / vt;
            fx[i] += s * vtx; fy[i] += s * vty;
            fx[j] -= s * vtx; fy[j] -= s * vty;
          }
          virial[i] -= Fn * r * 0.5; virial[j] -= Fn * r * 0.5;
          this.energy.contact += Math.abs(Fn * vn) * dt * 0.25;
        }
      }
      this.maxContactForce = maxF;
    } else this.maxContactForce = 0;

    // --------------------------------------------------------- body forces
    const g = this.gravity;
    for (let i = 0; i < n; i++) {
      if (!alive[i]) { fx[i] = 0; fy[i] = 0; continue; }
      fy[i] += mass[i] * g;
      virial[i] /= d.vol;
    }

    this.energy.plastic += ePlast;
    this.energy.fracture += eFrac;
    this.energy.damping += eDamp;
    this.brokenThisStep = broken;
    this.totalBroken += broken;
  }

  /** Kinetic energy of a role subset. */
  kineticOf(role) {
    const d = this.d;
    let e = 0;
    for (let i = 0; i < d.n; i++) {
      if (!d.alive[i]) continue;
      if (role !== undefined && d.role[i] !== role) continue;
      e += 0.5 * d.mass[i] * (d.vx[i] * d.vx[i] + d.vy[i] * d.vy[i]);
    }
    return e;
  }

  /** Total kinetic energy (all particles). */
  kinetic() { return this.kineticOf(undefined); }

  /** Elastic strain energy stored in the intact bonds. */
  strainEnergy() {
    const d = this.d;
    let U = 0;
    for (let b = 0; b < d.nb; b++) {
      if (d.bstate[b] !== BOND.INTACT) continue;
      const i = d.bi[b], j = d.bj[b];
      if (!d.alive[i] || !d.alive[j]) continue;
      // must use the same deviatoric measure the force law does, i.e. with the

/**
 * SCENE / GEOMETRY ENGINE
 * =======================
 *
 * The target is an ordered stack of layers along the line of sight plus a set
 * of internal components. Every layer owns a world-space polygon, so the same
 * geometry serves the ray cast that finds the impact point, the peridynamic
 * mesher that decides which lattice sites are solid, and the renderer.
 *
 * Layer placement: layer i's front face crosses y = 0 at x_i, and
 *
 *     x_{i+1} = x_i + t_i / cos(theta_i) + gap_{i+1}
 *

 * thickness follows from the slope, as it does on a real vehicle.

    slope: 0,             // deg from vertical; +ve = top leans away from shooter
    gap: 0,               // m of air in front of this layer
    height: 1.4,          // m of plate modelled in the cross-section
    offset: 0,            // m, shifts the plate along its own face

  battery: { label: 'Batteries', color: '#7e6fae', tough: 1200 },

      ]);

      L.normal = [nx, ny];
      L.tangent = [tx, ty];
      L.frontX = x;
      L.losThickness = los;
      L.mat = getMaterial(L.material);
      this.losTotal += los;

  isSolid(x, y) {

  }

  /**
   * March a ray through the stack. Returns ordered hits with entry/exit
   * parameters, obliquity and the layer reference.
   */
  raycast(ox, oy, dx, dy, maxT = 50) {

/**
 * PROJECTILE LIBRARY
 * ==================
 *
 * Each type is a *geometry + material + behaviour* description, not a label.
 * The differences between an APCBC shell and a long rod are expressed as
 *   - different cross-sections (so the meshed body is different),
 *   - different materials per part (so the constitutive response differs),
 *   - different assembly interfaces (so parts separate when they should),
 *   - different in-flight/fuzing behaviours (sabot discard, fuze delay, jet).
 * Everything downstream of that - erosion, shatter, ricochet, plugging - is
 * produced by the peridynamic solver, not by the type.
 *
 * OUT-OF-PLANE MASS CORRECTION
 * ----------------------------
 * The simulation is a plane-strain slice of depth h. A plate is genuinely
 * prismatic, so a slice of it needs no correction. A projectile is a body of
 * revolution, so a slice of width 2r(x) does not carry the right mass. Each
 * part therefore gets a scale factor
 *
 *      scale = (pi/4) * d_part / h,      h = (pi/4) * d_penetrator
 *
 * applied to both its density and its micromodulus. That preserves the part's
 * true mass and true axial force per unit of slab, and leaves the wave speed
 * unchanged. See docs/MODEL.md §2.3.
 */

// ---------------------------------------------------------------------------
// geometry helpers (local frame: +x = direction of travel, nose tip at x = 0)
// ---------------------------------------------------------------------------

/** Build a closed silhouette from a radius profile r(x), x in [-L, 0]. */
function profilePoly(rf, L, samples = 30, xEnd = 0) {
  const top = [], bot = [];
  for (let k = 0; k <= samples; k++) {
    const x = xEnd - L * (k / samples);
    const r = Math.max(1e-5, rf(x));
    top.push(x, r);
    bot.push(x, -r);
  }
  const pts = [];
  for (let k = 0; k < top.length; k += 2) pts.push(top[k], top[k + 1]);

/**
 * RIGID-BODY FLIGHT REGIME
 * ========================
 *
 * Away from contact the projectile is a rigid body: there is nothing for a
 * continuum solver to resolve, and the peridynamic time step (~0.2 us) would
 * make a 2 m approach take millions of steps for no physical content.
 *
 * The projectile is therefore integrated as a rigid body with drag and gravity
 * until it is a few lattice spacings from the target, at which point the world
 * hands its exact state (position, orientation, velocity, spin, geometry,
 * per-part materials) to the peridynamic mesher. Nothing is idealised at the
 * handover: the body that gets meshed is the body that was flying.
 *
 * The same class is reused for the *residual* penetrator after perforation,
 * rebuilt from whatever coherent mass survived, so a second plate is engaged
 * by the real remnant rather than by a fresh projectile.

const { getMaterial } = __req("src/materials/database.js");

    // Parts overlap (a cavity polygon sits inside its shell polygon) and the
    // mesher resolves that by first-match priority. Mass is therefore measured
    // by sampling the same priority rule on a fine grid, so the mass the user
    // sees is exactly the mass that will be meshed.

  /** Grid-sample the assembly using the mesher's first-match priority rule. */

  refArea() {

    return Math.PI * 0.25 * d * d;

    // Supersonic drag coefficient of a slender pointed body, near-constant in
    // the Mach range of interest. Sabot-on rounds are much draggier.
    const base = this.sabotAttached && this.type.sabot ? 0.62 : 0.29;
    return base;
  }

      const Fd = 0.5 * RHO_AIR * v * v * this.dragCoefficient() * this.refArea();
      const a = Fd / this.mass;

      this.vy -= (this.vy / v) * a * dt;
    }
    this.vy -= 9.81 * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.distance += v * dt;
    // fin/spin stabilised rounds track the velocity vector; nose yaw relaxes
    const flightAng = Math.atan2(this.vy, this.vx);
    const stab = this.type.key === 'apfsds' ? 8000 : 2500;
    let dA = flightAng - this.ang;

    this.ang += this.omega * dt;

    if (this.distance < (this.cfg.sabotRange ?? this.type.sabot.discardAt)) return null;

      const diry = Math.sin(a) * Math.cos(spread) + Math.cos(a) * side * Math.sin(spread);

        x: this.x + Math.cos(a) * (p.cx) - Math.sin(a) * p.cy,
        y: this.y + Math.sin(a) * (p.cx) + Math.cos(a) * p.cy,
        vx: dirx * sp, vy: diry * sp,
        mass: p.mass, size: this.geom.refDiameter * 0.4,
        label: 'sabot petal', kind: 'sabot', matKey: p.material,
      });
    }
    this.activeParts = this.parts.filter((p) => !p.sabot).map((p) => p.label);

  }

  /** Parts that should be meshed right now (sabot excluded once discarded). */
  meshParts() {
    return this.parts.filter((p) => !(p.sabot && !this.sabotAttached));
  }

  /** Local -> world transform of a polygon. */
  worldPoly(poly, pose = this) {
    const c = Math.cos(pose.ang), s = Math.sin(pose.ang);
    const out = new Float64Array(poly.length);
    for (let i = 0; i < poly.length; i += 2) {

      out[i + 1] = pose.y + poly[i] * s + poly[i + 1] * c;

  }

  tip() { return [this.x, this.y]; }

  /** Rear-most point in world space (along the axis). */
  tail() {
    const L = this.geom.length;
    return [this.x - Math.cos(this.ang) * L, this.y - Math.sin(this.ang) * L];
  }

  describe() {
    return {
      type: this.type.name,
      mass: this.mass,
      velocity: this.speed,
      ke: this.ke,
      sectionalDensity: this.mass / (Math.PI * 0.25 * Math.pow(this.geom.penDiameter, 2)),
      length: this.geom.length,
      penDiameter: this.geom.penDiameter,
      ld: this.geom.length / this.geom.penDiameter,
    };
  }
}

 * A residual penetrator reconstructed from the surviving peridynamic cluster.
 * Mass, length, diameter and velocity all come from the simulated remnant.

/**
 * FRAGMENT / SPALL TRANSPORT
 * ==========================
 *
 * Fragments are never spawned decoratively. Every fragment in this system was
 * promoted from the peridynamic solution: a particle (or a small coherent
 * cluster) whose bonds all failed and which then left the meshed corridor.
 * It carries the mass, velocity and energy it had at the moment it detached.
 *
 * Inside the corridor, spall is simply peridynamic material — it is drawn from
 * the particle state and can still collide with the penetrator and the channel
 * walls. Promotion happens only when a particle leaves the meshed region,
 * because past that point there is nothing left for the continuum solver to
 * do and a ballistic point mass is both cheaper and equally accurate.
 *
 * WHAT A FRAGMENT IS
 * ------------------
 * The 2-D slab gives every lattice node a mass but no third dimension, so the
 * drawn square (one lattice spacing) is NOT the size of the piece. The size
 * that matters for drag and for punching a plate is the diameter of a compact
 * body of that mass and that material,
 *
 *     d = (6 m / (pi rho))^(1/3)
 *
 * which is about twice the lattice spacing for a steel node. Using the drawn
 * square instead understated both the drag area and the plug diameter.
 *
 * MOTION
 * ------
 * Quadratic drag has a closed form, v(t) = v0 / (1 + k v0 t) with
 * k = rho_air Cd A / (2 m), so a frame's whole step is integrated exactly
 * rather than by one explicit Euler step - which at large k*dt reverses the
 * velocity of a light fragment.
 *
 * HITS ARE SWEPT, NOT SAMPLED
 * ---------------------------
 * A frame can advance a kilometre-per-second fragment by several millimetres,
 * more than a thin plate or a component casing is thick. Testing only the
 * start and end points lets it step straight over the plate. Every step is
 * therefore a segment, clipped against each (convex) plate and component, and
 * the crossings are resolved in the order they occur along the path.
 *
 * PERFORATION OF THIN STRUCTURE BY A FRAGMENT
 * -------------------------------------------
 * A fragment that strikes a plate or a component casing is resolved with a
 * plugging-work model rather than a fresh continuum run:
 *
 *   E_perf = k * pi * d * t^2 * tau        (shear-out of a plug)
 *   v_bl   = sqrt(2 E_perf / m)
 *   v_r    = (m / (m + m_plug)) * sqrt(v^2 - v_bl^2)      (Recht-Ipson, p = 2)
 *
 * with tau ~ 0.6 UTS and k a shape factor. t is the length of the actual chord
 * the fragment cuts through the plate (so a fragment crossing a sloped plate
 * obliquely sees the longer path, and one flying sideways through a plate sees
 * its whole width), not the plate's line-of-sight thickness for the main shot.
 * The plug leaves with the fragment as a separate piece, so momentum and mass
 * are conserved. This is the standard engineering treatment for compact
 * fragments and is documented in docs/MODEL.md §6.

const { modulePoly, MODULE_TYPES } = __req("src/sim/scene.js");

const RHO_AIR = 1.225;

const LIVE_SOFT_CAP = 1600;

/**
 * Minimal event bus + a timestamped simulation event log.
 *
 * The log is the audit trail of the run: every physically meaningful
 * transition (first contact, bond-failure onset, back-face rupture, sabot
 * discard, fuze arming, detonation, module hit, ...) is recorded with the
 * simulation time and the state that produced it. It is the primary object
 * the post-impact report is built from.
 */

class Bus {
  constructor() { this.map = new Map(); }
  on(type, fn) {
    if (!this.map.has(type)) this.map.set(type, new Set());
    this.map.get(type).add(fn);
    return () => this.off(type, fn);
  }
  off(type, fn) { const s = this.map.get(type); if (s) s.delete(fn); }
  emit(type, payload) {
    const s = this.map.get(type);
    if (s) for (const fn of s) fn(payload);
    const a = this.map.get('*');
    if (a) for (const fn of a) fn({ type, payload });
  }
}

const SEV = { INFO: 0, NOTE: 1, MAJOR: 2, CRITICAL: 3 };

class EventLog {
  constructor() { this.entries = []; this.seq = 0; }
  clear() { this.entries.length = 0; this.seq = 0; }
  add(t, type, text, severity = SEV.INFO, data = null) {
    const e = { id: this.seq++, t, type, text, severity, data };
    this.entries.push(e);
    return e;
  }
  /** Only add once per type (used for one-shot transitions). */
  addOnce(t, type, text, severity = SEV.INFO, data = null) {
    if (this.entries.some((e) => e.type === type)) return null;
    return this.add(t, type, text, severity, data);
  }
  has(type) { return this.entries.some((e) => e.type === type); }
  get(type) { return this.entries.find((e) => e.type === type) || null; }
  since(t) { return this.entries.filter((e) => e.t >= t); }
}

 * =====================
 *

 * vulnerability question — so components are resolved analytically:

 *   3. component-specific consequences are applied.

 * exactly what is driving each verdict. Nothing here is calibrated against

 * ========================
 *
 * Detonation is modelled as an *impulsive velocity field* applied to the metal
 * surrounding the charge, with the filler particles removed (they have become
 * gas). Fragmentation is not scripted: the imposed expansion velocity field

 * up on its own, with the fragment size distribution set by the material's

 * Mott's fragmentation theory describes, arrived at by simulation rather than

 * 1943), which is the standard first-order result for metal accelerated by a

 * material database). Near-field attenuation with distance is applied so that
 * material further from the charge than about a charge radius is driven less.
 *
 * SHAPED CHARGE
 * -------------

 * created as a compact copper slug carrying the axial velocity gradient the
 * PER (Pugh-Eichelberger-Rostoker, 1952) collapse model predicts. The
 * peridynamic solver then stretches that slug into a jet, and jet break-up,
 * standoff sensitivity and spaced-armour defeat emerge from the simulation

 * An ERA cassette is a sandwich: a steel front plate, a slab of insensitive

 * ==============
 *
 * Every rendered frame of an event is captured so the run can be scrubbed,
 * stepped forward and stepped backward after the fact. Two tiers:
 *
 *   display frames  - positions and every visualised field, quantised.
 *                     Enough to redraw and inspect any frame exactly.
 *   key frames      - full solver state (velocities, bond plastic stretch,
 *                     bond status, counters, energies). Because the solver is
 *                     deterministic, restoring a key frame and re-running
 *                     reproduces the original trajectory bit for bit, so
 *                     "rewind and continue" is exact rather than approximate.

/**
 * INDEPENDENT ANALYTIC CROSS-CHECKS
 * =================================
 *
 * The peridynamic run is the simulation. These closed-form engineering models
 * are *not* used to drive it — they are computed alongside it and reported
 * next to the simulated answer so the user can see whether the continuum model
 * is behaving sensibly for the case at hand.

 *      J. Mech. Phys. Solids 15 (1967) 387-399.
 *      Alekseevskii, V.P., Combust. Explos. Shock Waves 2 (1966) 63-66.
 *  - Hydrodynamic (Birkhoff) limit, P/L = sqrt(rho_p/rho_t)

 *  - de Marre empirical penetration correlation (19th-c. naval gunnery fit,
 *      still the standard first-order estimate for capped AP shot vs RHA)

 *  - Lambert-Jonas ballistic-limit form, v_r = a (v^p - v_bl^p)^(1/p)

 * WORLD — SIMULATION ORCHESTRATION
 * ================================
 *
 * Owns the regimes and the handovers between them. There is exactly one

 *           quiet, so the remaining bodies are advanced ballistically in big
 *           steps until something is about to touch again

 *           permanent deformed shape is what remains
 *   done    final state, fully inspectable

    // cassette came out WORSE than an inert one because detonation cleared the
    // charge from the jet's path without the plates ever doing any work.

    // local hit deflects only the few thicknesses nearest the shot. The slice
    // has no such support, so left free across the corridor it behaves as a
    // 400 mm strap: it dishes like taffy, tears from its clamps and flaps open
    // while the shot slips through the gap. Everything beyond a free zone sized
    // to the penetrator and the line-of-sight thickness is held instead.
    const freeHalf = plan.chemical ? Infinity

    this.coastMode = false;
    this.contactSeen = false;
    this.progressMark = 0;
    this.lastProgressTime = null;
    this.truncationLogged = false;

    // record what was actually meshed so the user can audit the discretisation

      particles: dom.n, bonds: dom.nb, dx, delta: dom.delta, slab: dom.slab,
      width: plan.width, length, dt: this.solver.dt,
      acrossPenetrator: p.geom.penDiameter / dx,
      throughThickness: this.scene.activeLayers().map((L) => L.thickness / dx),
    };
    this.log.add(this.simTime, 'mesh',
      `Continuum domain built — ${dom.n} nodes, ${dom.nb} bonds, dx = ${(dx * 1000).toFixed(2)} mm, ` +
      `dt = ${(this.solver.dt * 1e9).toFixed(0)} ns`, SEV.INFO, this.meshInfo);
    // A layer thinner than a couple of lattice spacings is not being simulated
    // as a layer, and anything that depends on it behaving like one - an ERA
    // cassette's plates above all - will be wrong. Say so rather than quietly
    // producing a number.
    const through = this.meshInfo.throughThickness;
    let worst = Infinity, worstIdx = -1;
    through.forEach((t, i) => { if (t < worst) { worst = t; worstIdx = i; } });
    this.meshInfo.minNodesThroughLayer = worst;
    if (worstIdx >= 0 && worst < 2) {
      const L = this.scene.activeLayers()[worstIdx];
      this.log.add(this.simTime, 'under-resolved',
        `${L.label || L.mat.name} is ${(L.thickness * 1000).toFixed(1)} mm against a `
        + `${(dx * 1000).toFixed(2)} mm lattice — ${worst.toFixed(1)} nodes through it. `
        + `A layer this thin cannot behave as a plate: raise Discretisation or narrow the `
        + `deformable zone before trusting anything that depends on it.`, SEV.MAJOR);
    }

      // a sensible viewing scale: about a dozen calibres across the frame
      span: Math.max(this.projectile.geom.penDiameter * 14, this.scene.losTotal * 3.2, plan.width * 0.55),
      x: p.x, y: p.y,
