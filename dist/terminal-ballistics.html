  }

  assembleDomain({ dx, width, length, originX, originY, dirx, diry, mRatio }) {
    const p = this.projectile;
    const dom = new PDDomain({
      dx, mRatio, slab: p.slab, origin: [originX, originY], dir: [dirx, diry],
      length, width, seed: this.settings.seed,
    });

    // --- projectile parts (filler/cavity first so it wins the point test) --
    let bodyId = 1;
    const parts = p.meshParts();
    const heatLinerOnly = p.cfg.type === 'heat';
    for (const part of parts) {
      if (heatLinerOnly && part.role !== 2) continue;
      if (heatLinerOnly && !/liner/.test(part.label)) continue;
      dom.addSolid({
        poly: p.worldPoly(part.poly),
        material: part.mat,
        bodyId: bodyId++,
        bondGroup: 1000,
        role: part.role === 1 ? ROLE.PENETRATOR : part.role === 3 ? ROLE.FILLER : ROLE.PROJ_AUX,
        vel: [p.vx, p.vy],
        scale: part.scale,
        // a slender kinetic rod's material has to flow, not shatter, to erode
        failMul: (part.role === 1 && ['apds', 'apfsds'].includes(p.cfg.type)) ? TUNE.rodDuctility : 1,
        strengthMul: (part.role === 1 && ['apds', 'apfsds'].includes(p.cfg.type))
          ? TUNE.rodStrength * flowStress(part.mat, TUNE.rodHardening) / flowStress(part.mat) : 1,
        label: part.label,
        partRef: part,
      });
    }

    // --- armour layers ----------------------------------------------------
    let group = 1;
    this.scene.activeLayers().forEach((L, idx) => {
      const prevBonded = L.bonded && idx > 0;
      const g = prevBonded ? group : ++group;
      const n = L.normal, front = L.frontX;
      dom.addSolid({
        poly: L.poly, material: L.mat, bodyId: 100 + idx, bondGroup: g,
        role: ROLE.ARMOUR, layerIdx: idx, label: L.label || L.mat.name,
        strengthMul: obliquityStrength(L.slope || 0),
        scale: obliquityDepth(L.slope || 0),
        gradientAxis: (x, y) => ((x - front) * n[0] + y * n[1]) / L.thickness,
      });
    });
    return dom;
  }

  // ---------------------------------------------------------------- impact

  impactPhase(wantDt, maxSteps) {
    const s = this.solver, d = this.domain;
    let advanced = 0;
    let steps = 0;
    const wantSteps = this.paused ? maxSteps : clamp(Math.round(wantDt / s.dt), 0, maxSteps);

    while (steps < Math.max(1, wantSteps)) {
      const dtc = this.maybeCoast();
      if (dtc > 0) {
        advanced += dtc;
        this.simTime += dtc;
      } else {
        if (this.coastDirty) {
          // positions jumped during coasting; the stored forces are stale
          s.refreshContactSet();
          s.computeForces();
          this.coastDirty = false;
          this.coastMode = false;
        }
        // step() may select a different dt for the NEXT step. Account for
        // the interval it actually integrated, including fragment transport.
        const dt = s.step();
        advanced += dt;
        this.simTime += dt;
      }
      steps++;
      // Latch transient activity before the next step overwrites the solver's
      // counters. Event ordering must not depend on substeps per video frame.
      this.observeContact();
      // ERA initiation is an integral over the shock, and a shock transit
      // through a 6 mm charge lasts under a microsecond, so it is sampled
      // twice as often as the fuze check to avoid stepping over the peak.
      if (steps % 2 === 0) this.stepEra();
      if (steps % 4 === 0) this.checkFuze();
    }
    this.perf.stepsLastFrame = steps;
    this.checkFuze();
    this.stepEra();
    this.checkModuleStrikes();
    this.fragments.step(advanced, this.scene, this.simTime, this.internals);
    // Escapees already reached the end of this interval in the node solver.
    // Hand them over AFTER advancing older fragments, so they are not moved
    // through the same interval twice or shown with an invented motion trail.
    this.promoteEscapees();
    this.updateStats();

    // settle / finish detection - only once the projectile has actually
    // touched something, otherwise the approach across the standoff gap would
    // read as "quiet" and end the run before the impact
    const armourKE = s.kineticOf(ROLE.ARMOUR);
    // QUIET MUST OUTLAST A GLANCING FIRST TOUCH
    // On a sloped plate the nose can brush the face and register contact for a
    // step or two, then register none for a few microseconds while the next
    // part of the nose reaches the surface. A fixed 4 us of silence closed the
    // run in that gap - four microseconds after first contact, with the round
    // still in flight - and reported "no penetration, depth 0". The silence has
    // to last for the round to cross a few lattice spacings at its own speed.
    const vApproach = Math.max(this.projectile.speed || 0, 50);
    const quietGap = Math.max(4e-6, 3 * d.dx / vApproach);
    const quiet = this.contactSeen && s.maxContactForce === 0 && s.brokenThisStep === 0
      && (this.simTime - (this.lastActivity ?? 0)) > quietGap;
    // WHEN THE RESOLVED WINDOW CLOSES
    //
    // This used to be a fixed clock: `elapsed > maxEventTime` and the run was
    // over. Measurement showed that cap was ending essentially EVERY run - a
    // 120 mm long rod fired at 600 mm of RHA was cut off 400 mm in, still
    // travelling at about 1000 m/s, and reported as "did not perforate,
    // residual 1000 m/s". That is not a result, it is a stopwatch expiring
    // mid-event, and it reads exactly like a round that never slows down.
    //
    // Penetration time scales with depth: a rod eating through half a metre
    // of steel at a penetration velocity of order 1 km/s genuinely needs
    // milliseconds. So the window now closes when the PHYSICS is finished:
    //
    //   - the penetrator has stopped making progress into the array for a
    //     sustained period (it is stopped, deflected, or fully consumed), or
    //   - it has left the back of the array and is no longer in contact.
    //
    // `maxEventTime` is kept only as the minimum window, so short events still
    // get their full resolved period. A separate, much larger backstop bounds
    // pathological runs - and when THAT one fires the result is explicitly
    // flagged as truncated rather than reported as though the round stopped.
    const elapsed = this.simTime - (this.trueContactTime ?? this.simTime);
    const minWindow = this.settings.maxEventTime ?? 3.5e-4;

    // "Progress" is penetration into the armour, not flight: armourDefeated is
    // bounded by the plate, so it stops growing the moment the round is
    // through or stalled, whereas depth keeps counting as debris flies on.
    const prog = this.stats.armourDefeated || 0;
    if (prog > (this.progressMark ?? 0) + d.dx * 0.5) {
      this.progressMark = prog;
      this.lastProgressTime = this.simTime;
    }
    const sinceProgress = this.simTime - (this.lastProgressTime ?? this.trueContactTime ?? this.simTime);
    const stalled = this.contactSeen && sinceProgress > (this.settings.stallTime ?? 8e-5);

    const hardCap = this.settings.maxEventTimeHard ?? 6e-3;
    const truncated = this.contactSeen && elapsed > hardCap;
    if (truncated && !this.truncationLogged) {
      this.truncationLogged = true;
      this.stats.truncated = true;
      this.log.add(this.simTime, 'truncated',
        `Resolved window hit its ${(hardCap * 1e3).toFixed(1)} ms backstop with the round still `
        + `making progress — the reported depth and residual velocity are a LOWER BOUND, `
        + `not a final state`, SEV.MAJOR);
    }
    const overrun = this.contactSeen && ((stalled && elapsed > minWindow) || truncated);
    // A meshed shot that never touches anything - it missed inside the
    // corridor, or the remnant left without contacting a later layer - would
    // otherwise sit in the impact regime forever with nothing to resolve.
    if (!this.contactSeen && this.simTime - this.impactStartTime > 3e-3) {
      this.log.add(this.simTime, 'no-contact',
        'Projectile left the meshed corridor without contacting the array', SEV.NOTE);
      this.finish('miss');
      return;
    }
    if (this.state === 'impact' && (overrun || (quiet && armourKE < Math.max(this.impactKE0 * 0.004, 1)))) {
      this.state = 'settle';
      this.settleTime = this.simTime;
      this.log.add(this.simTime, 'settle', 'Contact phase complete — residual state settling', SEV.NOTE);
    }
    if (this.state === 'settle') {
      // bleed residual elastic ringing so the permanent set is what remains
      for (let i = 0; i < d.n; i++) {
        if (!d.alive[i]) continue;
        const sp = Math.hypot(d.vx[i], d.vy[i]);
        if (sp < 120) { d.vx[i] *= 0.90; d.vy[i] *= 0.90; }
      }
      if (this.simTime - this.settleTime > 4e-5 && this.fragments.liveCount === 0) this.beginDebris('settled');
      else if (this.simTime - this.settleTime > 1.2e-4) this.beginDebris('settled');
    }
  }

  /**
   * COAST FAST-FORWARD
   * ------------------
   * Crossing a standoff gap or an air gap in a spaced array is pure free
   * flight: no contact, no bond activity, plate quiet. Resolving that at the
   * CFL step would burn thousands of steps on nothing. When the *smallest*
   * clearance between any moving node and any solid is comfortably larger
   * than the lattice spacing, the moving material is advanced ballistically
   * by a step sized so it cannot cross that clearance. As soon as the gap
   * closes to a few lattice spacings, coasting stops and every step is
   * resolved again.
   *
   * @returns {number} simulated seconds advanced, or 0 if the caller must
   *                   take a normal solver step instead.
   */
  maybeCoast() {
    const s = this.solver, d = this.domain;
    if (this.state === 'settle' || this.contactSeen) return 0;
    if (s.maxContactForce > 0 || s.brokenThisStep > 0) return 0;

    let vmax = 0, armKE = 0;
    for (let i = 0; i < d.n; i++) {
      if (!d.alive[i]) continue;
      const v2 = d.vx[i] * d.vx[i] + d.vy[i] * d.vy[i];
      if (d.role[i] === ROLE.ARMOUR) { armKE += 0.5 * d.mass[i] * v2; continue; }
      if (v2 > vmax) vmax = v2;
    }
    vmax = Math.sqrt(vmax);
    if (vmax < 50) return 0;
    if (armKE > Math.max(this.impactKE0 * 0.004, 2)) return 0;

    // smallest gap between any moving node and any solid surface
    let clearance = 0.8;
    const layers = this.scene.activeLayers();
    for (let i = 0; i < d.n && clearance > 0; i++) {
      if (!d.alive[i] || d.role[i] === ROLE.ARMOUR) continue;
      if (d.vx[i] * d.vx[i] + d.vy[i] * d.vy[i] < 2500) continue;
      for (const L of layers) {
        if (pointInPoly(L.poly, d.px[i], d.py[i])) return 0;
        const dd = distToPolyEdge(L.poly, d.px[i], d.py[i]);
        if (dd < clearance) clearance = dd;
      }
    }
    for (const m of this.scene.modules) {
      if (m.type !== 'void') clearance = Math.min(clearance, Math.max(m.w, m.h) * 0.5);
    }
    // too close to be worth it: resolve properly
    if (clearance < d.dx * 4) { this.coastMode = false; return 0; }

    const dt = clamp(0.35 * clearance / vmax, s.dt, s.dt * 500);
    for (let i = 0; i < d.n; i++) {
      if (!d.alive[i]) continue;
      if (d.vx[i] * d.vx[i] + d.vy[i] * d.vy[i] < 400) continue;
      d.px[i] += d.vx[i] * dt;
      d.py[i] += d.vy[i] * dt;
    }
    s.time += dt;
    this.coastMode = true;
    this.coastDirty = true;
    return dt;
  }

  // ------------------------------------------------------- event hooks

  observeContact() {
    const s = this.solver, d = this.domain;
    if (!s || !d || !(s.maxContactForce > 0 || s.brokenThisStep > 0)) return;
    this.lastActivity = this.simTime;
    if (this.contactSeen) return;
    this.contactSeen = true;
    this.trueContactTime = this.simTime;
    let bx = 0, by = 0, bs = -Infinity;
    for (let i = 0; i < d.n; i++) {
      if (!d.alive[i] || d.role[i] === ROLE.ARMOUR) continue;
      const sPos = (d.px[i] - d.ox) * d.ax + (d.py[i] - d.oy) * d.ay;
      if (sPos > bs) { bs = sPos; bx = d.px[i]; by = d.py[i]; }
    }
    this.stats.impactX = bx; this.stats.impactY = by;
    this.log.add(this.simTime, 'first-contact',
      `First resolved contact at (${(bx * 1000).toFixed(0)}, ${(by * 1000).toFixed(0)}) mm`, SEV.MAJOR);
  }

  checkFuze() {
    const p = this.projectile;
    const fz = p.type.fuze;
    if (!fz || p.detonated) return;
    // HEAT currently meshes only its liner. It is an imposed formation model,
    // not a conventional shell with filler nodes to detonate later. Sending
    // it through detonateShell() reported a spurious "filler consumed" dud.
    if (p.cfg.type === 'heat') {
      if (p.fuzeState !== 'safe') return;
      p.fuzeTimer = this.simTime;
      p.detonated = true;
      this.log.add(this.simTime, 'jet-model', 'Simplified HEAT model selected: imposed liner formation at continuum handoff', SEV.NOTE);
      const formed = this.formJet();
      p.fuzeState = formed ? 'functioned' : 'dud';
      if (!formed) this.log.add(this.simTime, 'jet-unavailable', 'No liner nodes were available for the simplified formation event', SEV.MAJOR);
      return;
    }
    if (p.fuzeState === 'safe') {
      // Meshing starts ahead of contact. Entering the continuum regime alone
      // must not start an impact-triggered event's delay clock.
      if (!this.contactSeen) return;
      p.fuzeState = 'armed';
      p.fuzeTimer = this.trueContactTime ?? this.simTime;
      this.log.add(this.simTime, 'fuze-arm',
        `Fuze armed on impact setback (${fz.kind}, ${(this.projectile.cfg.fuzeDelay ?? fz.delay) * 1e6} µs delay)`, SEV.NOTE);
    }
    if (p.fuzeState !== 'armed') return;
    const delay = this.projectile.cfg.fuzeDelay ?? fz.delay;
    if (this.simTime - p.fuzeTimer < delay) return;
    this.detonateShell();
  }

  /**
   * Advance every ERA cassette. Called on the same cadence as the fuze check:
   * initiation is a P^2*tau integral, so it only needs to see the stress state
   * a few times per shock transit, not every step.
   */
  stepEra() {
    if (!this.cassettes || !this.cassettes.length || !this.domain) return;
    const dt = this.simTime - this.eraLastT;
    if (dt <= 0) return;
    this.eraLastT = this.simTime;
    const ev = stepCassettes(this.cassettes, this.domain, this.simTime, dt,
      this.settings.eraEfficiency ?? 0.45);
    if (!ev.length) return;
    logCassetteEvents(this.log, this.simTime, ev);
    for (const e of ev) {
      if (e.kind === 'era-initiate') this.bus.emit('era-initiate', e.cassette);
    }
  }

  detonateShell() {
    const p = this.projectile, d = this.domain;
    p.detonated = true;
    p.fuzeState = 'functioned';
    // charge mass and Gurney velocity come from the filler material record
    const fillerKey = p.cfg.filler || 'compb';
    const fm = getMaterial(fillerKey);
    let cm = 0, cx = 0, cy = 0, cn = 0;
    for (let i = 0; i < d.n; i++) {
      if (!d.alive[i] || d.role[i] !== ROLE.FILLER) continue;
      cm += d.mass[i]; cx += d.px[i]; cy += d.py[i]; cn++;
    }
    if (cn === 0) {
      p.fuzeState = 'dud';
      this.log.add(this.simTime, 'fuze-dud',
        'Fuze functioned but the filler had already been consumed or dispersed — no coherent detonation',
        SEV.NOTE);
      return;
    }
    cx /= cn; cy /= cn;
    const keBefore = this.solver.kinetic();
    const radius = Math.sqrt(cn) * d.dx * 0.6;
    const info = detonate(d, {
      cx, cy, chargeMass: cm, gurneyVel: fm.gurney || 2400, radius,
      geometry: p.cfg.type === 'hesh' ? 'sandwich' : 'cylindrical',
    });
    info.chargeMass = cm; info.x = cx; info.y = cy;
    // The burst injects chemical energy the audit baseline knows nothing about.
    // Fold the delivered kinetic energy into E0 so the closure figure keeps
    // meaning something after a detonation.
    this.solver.E0 += Math.max(0, this.solver.kinetic() - keBefore);
    info.deliveredKE = this.solver.kinetic() - keBefore;
    logDetonation(this.log, this.simTime, p.type.name, info);
    this.stats.detonation = info;
    this.bus.emit('detonation', info);
  }

  /**
   * HEAT: impose the collapse outcome on the liner. The liner particles are
   * given an inward-radial collapse component plus the axial velocity gradient
   * predicted by the PER collapse model, and the peridynamic solver takes it
   * from there — the jet forms, stretches, and (at long standoff) particulates
   * on its own. Liner collapse itself is NOT simulated; see MODEL.md §5.3.
   */
  formJet() {
    const p = this.projectile, d = this.domain;
    const j = p.type.jet;
    const tip = p.cfg.jetTip ?? j.tip, tail = p.cfg.jetTail ?? j.tail;
    const [ax, ay] = normalize(p.vx, p.vy);
    const bx = -ay, by = ax;
    // apex position along the axis
    let sMin = Infinity, sMax = -Infinity;
    const idx = [];
    for (let i = 0; i < d.n; i++) {
      if (!d.alive[i] || d.role[i] !== ROLE.PROJ_AUX) continue;
      idx.push(i);
      const s = (d.px[i] - p.x) * ax + (d.py[i] - p.y) * ay;
      if (s < sMin) sMin = s;
      if (s > sMax) sMax = s;
    }
    if (!idx.length) return false;
    const keBefore = this.solver.kinetic();
    const span = Math.max(sMax - sMin, 1e-4);
    for (const i of idx) {
      const s = (d.px[i] - p.x) * ax + (d.py[i] - p.y) * ay;
      const u = (d.px[i] - p.x) * bx + (d.py[i] - p.y) * by;
      const f = clamp((s - sMin) / span, 0, 1);     // 1 = apex end (jet tip)
      const vAx = tail + (tip - tail) * f;
      const collapse = 1800;                        // radial collapse velocity
      d.vx[i] = ax * vAx - Math.sign(u) * bx * collapse * clamp(Math.abs(u) / (span * 0.5), 0, 1);
      d.vy[i] = ay * vAx - Math.sign(u) * by * collapse * clamp(Math.abs(u) / (span * 0.5), 0, 1);
      d.role[i] = ROLE.PENETRATOR;
    }
    this.solver.E0 += Math.max(0, this.solver.kinetic() - keBefore);
    // the liner has just become the penetrator; the cached initial penetrator
    // mass was measured before that and is now stale
    this._penMass0Domain = null;
    this.log.add(this.simTime, 'jet-formed',
      `Shaped-charge liner collapsed — imposed jet gradient ${tail.toFixed(0)}-${tip.toFixed(0)} m/s over ${(span * 1000).toFixed(0)} mm`,
      SEV.MAJOR);
    return true;
  }

  /** Fast peridynamic material striking an internal component. */
  checkModuleStrikes() {
    const d = this.domain;
    if (!d || !this.scene.modules.length) return;
    for (const m of this.scene.modules) {
      if (m.type === 'void') continue;
      const poly = modulePoly(m);
      for (let i = 0; i < d.n; i++) {
        if (!d.alive[i]) continue;
        const v2 = d.vx[i] * d.vx[i] + d.vy[i] * d.vy[i];
        if (v2 < 2500) continue;
        if (!pointInPoly(poly, d.px[i], d.py[i])) continue;
        const e = 0.5 * d.mass[i] * v2;
        this.internals.applyHit(m, {
          energy: e, mass: d.mass[i], velocity: Math.sqrt(v2),
          source: d.role[i] === ROLE.PENETRATOR ? 'penetrator' : 'fragment',
          t: this.simTime, x: d.px[i], y: d.py[i],
        });
        // the strike is spent on the component
        d.vx[i] *= 0.25; d.vy[i] *= 0.25;
      }
    }
  }

  /**
   * Material that has left the meshed corridor is promoted to a ballistic
   * fragment. It keeps its mass, velocity and energy; the continuum solver
   * has nothing left to say about it.
   *
   * WHAT COUNTS AS "LEFT"
   * The corridor is a window cut out of a larger plate, so its side walls are
   * NOT free space: the plate continues beyond them, and the outermost rows
   * are clamped or absorbing boundary nodes standing in for it. This used to
   * test a threshold one lattice spacing INSIDE the wall, which every boundary
   * node started beyond. The clamped rows were deleted as "slow debris", and
   * any boundary node the shock set trembling above 12 m/s was launched as a
   * ballistic fragment - a spray of fake spall coming off the edges of the
   * window. It also let material that really did leave sideways fly on through
   * the surrounding plate as if it were air.
   *
   * Now:
   *   - nodes still bonded into the lattice (not free, not projectile) and
   *     every boundary node stay where they are;
   *   - beyond the walls, material that ends up INSIDE a plate is stopped by
   *     that plate and is retired, with its momentum kept on the books if it
   *     was projectile;
   *   - only material that emerges into open space becomes a fragment.
   * Front and rear exits are open space by construction.
   */
  promoteEscapees(force = false) {
    const d = this.domain;
    const halfW = d.width * 0.5 + d.dx;
    const layers = this.scene.activeLayers();
    for (let i = 0; i < d.n; i++) {
      if (!d.alive[i]) continue;
      const fl = d.flags[i];
      if (fl & 4) continue;                       // clamped: part of the wall, never debris
      const dx = d.px[i] - d.ox, dy = d.py[i] - d.oy;
      const s = dx * d.ax + dy * d.ay;
      const u = dx * d.bx + dy * d.by;
      const lateral = Math.abs(u) >= halfW;
      const ends = s <= -d.dx || s >= d.length + d.dx;
      const pen = d.role[i] !== ROLE.ARMOUR && d.role[i] !== ROLE.MODULE;
      const free = pen || (fl & 8) !== 0;
      const v = Math.hypot(d.vx[i], d.vy[i]);
      if (force) {
        // end of the continuum phase: loose, moving material that is not
        // sitting inside a plate goes ballistic; everything else rests
        if (!free || v < 12) continue;
        if (layers.some((L) => pointInPoly(L.poly, d.px[i], d.py[i]))) continue;
      } else {
        if (!lateral && !ends) continue;
        // lattice material still attached to its neighbours is not debris,
        // unless it has left through the front or rear of the array
        if (!ends && !free) continue;
      }
      const inPlate = lateral && !ends && layers.some((L) => pointInPoly(L.poly, d.px[i], d.py[i]));
      // slow debris, material that has run into the plate beside the window,
      // and (past the cap) the unimportant tail are retired rather than
      // transported. Their mass is still accounted for.
      const ke = 0.5 * d.mass[i] * v * v;
      // Detonation products and loose explosive are gas and dust, not
      // fragments. Carrying them as steel-like pieces made a functioning
      // reactive cassette "fire" hundreds of grams of fake shrapnel through the
      // hull at 600 m/s, and punched them into the crew compartment as
      // fragment hits. Their mass is still accounted for as retired.
      const gas = (fl & 16) !== 0 || d.matTable[d.matIndex[i]].mat.class === 'explosive';
      if (v < 12 || inPlate || gas || !this.fragments.accepts(ke)) {
        d.alive[i] = 0;
        this.stats.retiredMass = (this.stats.retiredMass || 0) + d.mass[i];
        this.stats.retiredCount = (this.stats.retiredCount || 0) + 1;
        // Keep its momentum on the books if it was part of the projectile.
        // Dropping a slow piece silently RAISES the reported remnant speed,
        // which is one of the ways the round appears to accelerate.
        if (pen) {
          this.retiredProjM = (this.retiredProjM || 0) + d.mass[i];
          this.retiredProjPX = (this.retiredProjPX || 0) + d.vx[i] * d.mass[i];
          this.retiredProjPY = (this.retiredProjPY || 0) + d.vy[i] * d.mass[i];
        }
        continue;
      }
      this.fragments.add({
        x: d.px[i], y: d.py[i], vx: d.vx[i], vy: d.vy[i],
        mass: d.mass[i], size: d.dx * 1.1,
        kind: d.role[i] === ROLE.PENETRATOR ? 'penetrator' : d.role[i] === ROLE.ARMOUR ? 'spall' : 'casing',
        matKey: d.matTable[d.matIndex[i]].mat.key,
        bornAt: this.simTime,
        source: d.role[i] === ROLE.ARMOUR ? 'armour' : 'projectile',
        // Rendering metadata only: preserve the material's appearance when
        // switching representation, rather than flashing new orange squares.
        appearance: {
          materialColor: d.matTable[d.matIndex[i]].mat.color,
          damage: d.damage[i], detached: (fl & 8) !== 0,
          plastic: d.plStrain[i] / Math.max(d.matTable[d.matIndex[i]].pd.epsF * 3, 1e-4),
          temp: d.temp[i], stress: d.virial[i], nodeSize: d.dx,
        },
      });
      d.alive[i] = 0;
    }
  }

  /**
   * THE LAST OF THE CONTINUUM, THEN THE DEBRIS
   * The resolved window ends when the penetrator and the plate have stopped
   * interacting - but anything thrown out of it is still flying. The run used
   * to be declared finished at that instant and the world frozen, so spall and
   * remnant pieces hung motionless in the air a few centimetres from the plate
   * and never reached the crew compartment, the ammunition or the next layer
   * of an array that sits a metre behind. Component damage was therefore
   * decided by what happened to be in range at the moment of the freeze.
   *
   * Now the loose material that is still moving is handed to the ballistic
   * transport and the world keeps flying it until everything has stopped or
   * left. The verdict is issued after that, so it includes what the debris did.
   */
  beginDebris(reason) {
    this.finishReason = reason;
    this.promoteEscapees(true);
    this.state = 'debris';
    this.debrisStart = this.simTime;
    this.log.add(this.simTime, 'debris',
      `Continuum resolved - ${this.fragments.liveCount} pieces of debris still in flight`, SEV.NOTE);
    if (this.fragments.liveCount === 0) this.endDebris();
  }

  debrisPhase(wantDt) {
    const vmax = this.fragments.fastest();
    // a frame moves the fastest piece about 2 cm, so it is seen to travel
    let dt = clamp(0.02 / Math.max(vmax, 1), 5e-6, 6e-4);
    dt = Math.min(dt, Math.max(wantDt, 5e-6) * 4);
    // A user-specified budget is a stop request, not evidence that debris has
    // settled. Without one, let the existing transport finish naturally. The
    // generous backstop bounds pathological scenes and is reported explicitly.
    const limit = this.settings.debrisTime ?? 30;
    for (let k = 0; k < 4 && this.fragments.liveCount > 0; k++) {
      this.simTime += dt;
      this.fragments.step(dt, this.scene, this.simTime, this.internals);
      if (this.simTime - this.debrisStart >= limit) break;
    }
    this.updateStats();
    if (this.fragments.liveCount > 0 && this.simTime - this.debrisStart >= limit) {
      this.stats.debrisTruncated = true;
      this.log.add(this.simTime, 'debris-truncated',
        `Debris time budget reached with ${this.fragments.liveCount} pieces still active; later interactions were not simulated`, SEV.MAJOR);
    }
    if (this.fragments.liveCount === 0 || this.stats.debrisTruncated) {
      this.endDebris();
    }
  }

  endDebris() {
    const F = this.fragments;
    if (F.stoppedInPlate || F.stoppedByCasing || F.impacts.length) {
      this.log.add(this.simTime, 'debris-end',
        `Debris ${this.stats.debrisTruncated ? 'stopped at budget' : 'complete'}: ${F.stoppedInPlate} pieces embedded in plate, ${F.impacts.length} reached components`
        + `${F.stoppedByCasing ? `, ${F.stoppedByCasing} stopped by casings` : ''}`, SEV.NOTE);

  // ---------------------------------------------------------------- stats

  updateStats() {
    const d = this.domain, st = this.stats;
    if (!d) return;
    const layers = this.scene.activeLayers();
    const first = layers[0];
    if (!first) return;

    // DEPTH FRAMES
    // Two different measures get confused very easily, so they are kept
    // explicitly apart here:
    //   normal depth  - distance through the plate along its own normal. This
    //                   is "how much plate thickness has been defeated", and it
    //                   is what the perforation test must use.
    //   line of sight - distance along the shot line. On a plate sloped at
    //                   theta this is longer by 1/cos(theta): a 120 mm plate at
    //                   60 deg is 240 mm of LOS.
    // Comparing a normal depth against an LOS thickness under-reports
    // perforation by exactly that factor, and pins the back-face bulge test at
    // a threshold the plate can never reach.
    const n0 = first.normal;
    const fx = first.frontX;
    const last = layers[layers.length - 1];
    const nL = last.normal, fxL = last.frontX;
    const tL = last.thickness;              // NORMAL thickness of the last layer
    const ix = st.impactX ?? fx, iy = st.impactY ?? 0;
    const ax = d.ax, ay = d.ay;             // shot direction
    const channelHalfWidth = this.projectile.geom.penDiameter * 0.9;
    const channelRadius = this.projectile.geom.penDiameter * 2.0;

    // DEPTH AS A MASS PERCENTILE, NOT A SINGLE DEEPEST NODE
    // The tip of a comminuted penetrator is a cloud, and its foremost node is
    // noise. Depth is therefore the deepest plane that at least PEN_FRACTION of
    // the original penetrator mass has reached, accumulated from the deep end
    // of a histogram. Perforation uses the same measure in the last layer's
    // frame, so "depth exceeds the plate" and "perforated" can no longer
    // disagree - they are the same number read against the same threshold.
    const NB = 256, NL = 64;
    if (!this._histA) { this._histA = new Float32Array(NB); this._histB = new Float32Array(NB); }
    const histA = this._histA, histB = this._histB;
    histA.fill(0); histB.fill(0);

    // PER-LAYER PENETRATION
    // Depth measured from the struck face counts air gaps: a round that has
    // crossed a 300 mm stand-off in a spaced array reads as "300 mm of
    // penetration" while having defeated 10 mm of plate. What the user wants
    // is armour defeated, so each layer keeps its own histogram and the totals
    // are summed with the gaps excluded.
    if (!this._histL || this._histL.length < layers.length) {
      this._histL = layers.map(() => new Float32Array(NL));
      this._pastL = new Float32Array(layers.length);
    }
    const histL = this._histL, pastL = this._pastL;
    for (let k = 0; k < layers.length; k++) { histL[k].fill(0); pastL[k] = 0; }
    const aLo = -0.03, aHi = this.scene.normalTotal + 0.20;
    const bLo = -0.05, bHi = tL + 0.20;
    const aStep = (aHi - aLo) / NB, bStep = (bHi - bLo) / NB;

    // WHICH LAYER IS THE BULGE MEASURED ON
    // The last layer in the array is not necessarily the one being deformed.
    // A round that stops in the front plate of a two-plate array leaves that
    // plate visibly dished while the rear plate is untouched, and measuring
    // the bulge on the rear plate reported 0 um for an obvious bulge. The
    // bulge belongs to the deepest layer the penetrator has actually entered.
    let bulgeIdx = 0;
    for (let i = 0; i < d.n; i++) {
      if (!d.alive[i] || d.role[i] !== ROLE.PENETRATOR) continue;
      for (let k = layers.length - 1; k > bulgeIdx; k--) {
        const Lk = layers[k];
        if ((d.px[i] - Lk.frontX) * Lk.normal[0] + d.py[i] * Lk.normal[1] > 0) { bulgeIdx = k; break; }
      }

    let penMass = 0;

    let sMin = Infinity, sMax = -Infinity, uMin = Infinity, uMax = -Infinity;
    let spall = 0, freeCount = 0, hot = 293, coherent = 0, attached = 0;

    // A capped shot is not one body: the core, the cap and the windscreen
    // exchange momentum through elastic waves for as long as they stay in
    // contact. Quoting the core's own centre-of-mass velocity therefore shows
    // it OSCILLATING - it was measured swinging 877 -> 874.4 -> 875.7 m/s
    // while the assembly as a whole decelerated smoothly from 854 to 821 -
    // and a round crossing a stand-off gap appears to speed up. Nothing is
    // gaining energy; momentum is sloshing between parts that are still
    // touching. The reported figure is the whole coherent remnant, which is
    // also what "residual velocity" means in the literature: the mass that
    // emerges, not one component of it.
    let remM = 0, remVX = 0, remVY = 0;
    let bulge = 0;

    for (let i = 0; i < d.n; i++) {
      if (!d.alive[i]) continue;
      if (d.temp[i] > hot) hot = d.temp[i];
      // PENETRATOR ACCOUNTING
      // Comminuted material has not gone anywhere: a shattered carbide core is
      // still 1.8 kg of dense debris inside the cavity, still being driven
      // forward, still doing work through contact. Counting only *attached*
      // nodes reports a fully comminuted penetrator as "0 mg at 0 m/s", which
      // is not what the solver computed. So the primary figures cover every
      // penetrator node still in the domain, and coherence is reported beside
      // them rather than instead of them.
      if (d.role[i] === ROLE.PENETRATOR) {
        const m = d.mass[i];
        penMass += m;
        if (!(d.flags[i] & 8)) attached += m;
        if (d.damage[i] < 0.5) coherent += m;

        // DEPTH IS A PROPERTY OF THE CHANNEL, NOT OF THE DEBRIS CLOUD.
        // A comminuted penetrator throws material sideways and backwards along
        // the struck face in wide fans. Taking the deepest node over all of it
        // lets one ejected fragment define the penetration depth. Only material
        // still inside the channel - within a couple of penetrator diameters of
        // the shot axis - counts towards depth, velocity and perforation.
        const lat = Math.abs((d.px[i] - d.ox) * d.bx + (d.py[i] - d.oy) * d.by);
        if (lat > channelRadius) continue;

        if (d.vx[i] * ax + d.vy[i] * ay < -50) continue;

        chanMass += m;
        chanVX += d.vx[i] * m; chanVY += d.vy[i] * m;
        chanKE += 0.5 * m * (d.vx[i] * d.vx[i] + d.vy[i] * d.vy[i]);

        const ia = Math.min(NB - 1, Math.max(0, ((depth - aLo) / aStep) | 0));

        const ib = Math.min(NB - 1, Math.max(0, ((dLast - bLo) / bStep) | 0));
        histB[ib] += m;

        if (dLos > deepestLos) deepestLos = dLos;

          if (dk <= 0) continue;

      // step, and dropping it from the average makes the reported speed JUMP -
      // measured rising by up to 0.9 m/s in mid-gap with nothing touching the
      // round, purely because a slower-than-average node stopped counting.
      // Every rise seen during free flight was of exactly this kind. Comminuted
      // material driven forward in the channel is still part of the remnant and
      // still arrives at the next plate, so it keeps counting.
      // Every surviving piece of projectile, with NO position or velocity
      // weighting. Any weight that depends on where a node is changes as the
      // debris cloud spreads, so the reported speed drifts upward even in free
      // flight - a channel cut, a tapered channel cut and a free-flag test were
      // each measured doing it, by up to 1 m/s between plates with nothing
      // touching the round. Over a set fixed at mesh time the figure is exact:
      // internal forces cancel, so it can only change when something outside
      // the projectile pushes it. Mass times this velocity is the projectile's
      // remaining momentum, which is what the mass readout beside it means.
      if (d.role[i] !== ROLE.ARMOUR && d.role[i] !== ROLE.MODULE) {

        // spalled plate, so it must not be reported as spall mass

        // is still attached. Detached material is spall, not bulge, so it is
        // excluded - otherwise a scab flying off would be reported as an
        // enormous bulge.
        // Measured in that layer's own frame against its NORMAL thickness,
        // and only outside the channel: material being pushed out through the
        // hole is petalling, not bulging, and would otherwise dominate the
        // figure once the plate is perforated. A bulge is the dishing of the
        // rear face *around* the impact.
        if (d.damage[i] < 0.45 && d.layer[i] === bulgeIdx) {
          const lat = Math.abs((d.rx[i] - d.ox) * d.bx + (d.ry[i] - d.oy) * d.by);
          if (lat > channelHalfWidth) {
            const dep = (d.px[i] - fxB) * nB[0] + d.py[i] * nB[1];
            const ref = (d.rx[i] - fxB) * nB[0] + d.ry[i] * nB[1];

            }
          }

      }

    // have a floor: with need = 0 the very first histogram bin satisfies it and
    // a HESH round would report perforating a plate it never entered.
    const need = Math.max(this.penetratorMass0() * PEN_FRACTION, 1e-9);
    let acc = 0;
    for (let k = NB - 1; k >= 0; k--) {
      acc += histA[k];
      if (acc >= need) { deepest = aLo + (k + 1) * aStep; break; }
    }
    acc = 0;
    for (let k = NB - 1; k >= 0; k--) {
      acc += histB[k];
      if (acc >= need) { deepestLast = bLo + (k + 1) * bStep; break; }
    }

    // armour actually defeated, layer by layer, gaps excluded
    let defeated = 0;
    for (let k = 0; k < layers.length; k++) {
      const Lk = layers[k];
      if (pastL[k] >= need) { defeated += Lk.thickness; continue; }

      }
    }
    st.armourDefeated = Math.max(st.armourDefeated || 0, defeated);

    // DEPTH IS BOUNDED BY THE ARMOUR
    //
    // `deepest` is measured from the struck face along the shot line, and once
    // the remnant is through the back of the array it keeps growing - the
    // number then describes how far debris has FLOWN, not how far it has
    // penetrated. Unbounded, it reports 466 mm of "depth" on a 266 mm array
    // and, worse, it converges to the same value for every variant of a
    // perforating shot, because what it is really measuring is remnant
    // velocity times whatever is left of the resolved window. Two cassettes,
    // live and inert, were measured reporting depth identical to the
    // millimetre for exactly this reason - which reads as "nothing I change
    // makes any difference".
    //
    // So the reported depth is clipped at the back of the array. Past that
    // point the round is through and the figure that still carries
    // information is the residual velocity, which is reported beside it.
    const totalNormal = layers.reduce((s2, L2) => s2 + L2.thickness, 0);
    st.arrayThickness = totalNormal;
    st.maxDepth = Math.min(totalNormal,
      Math.max(st.maxDepth, isFinite(deepest) ? deepest : 0));
    // same bound along the shot line, against the array's line-of-sight total
    const totalLos = layers.reduce(
      (s2, L2) => s2 + L2.thickness / Math.max(0.2, Math.cos((L2.slope || 0) * Math.PI / 180)), 0);
    st.arrayThicknessLOS = totalLos;
    st.maxDepthLOS = Math.min(totalLos,
      Math.max(st.maxDepthLOS || 0, isFinite(deepestLos) ? deepestLos : 0));
    st.residualMass = penMass;          // penetrator material still in the domain
    st.attachedMass = attached;         // of that, still bonded into one body
    st.coherentMass = coherent;         // of that, still largely undamaged
    st.comminutedMass = Math.max(0, penMass - attached);
    st.channelMass = chanMass;
    // Projectile material retired from the lattice is still projectile
    // material: it is flying on as a ballistic fragment. Leaving it out means
    // the figure ticks upward every time a slow piece is retired, which is the
    // last source of apparent acceleration in free flight.
    for (const fr of this.fragments.list) {
      if (!fr.alive || fr.source !== 'projectile') continue;
      remM += fr.mass; remVX += fr.vx * fr.mass; remVY += fr.vy * fr.mass;
    }
    remM += this.retiredProjM || 0;
    remVX += this.retiredProjPX || 0;
    remVY += this.retiredProjPY || 0;
    st.residualVelocity = remM > 0 ? Math.hypot(remVX / remM, remVY / remM)
      : (chanMass > 0 ? Math.hypot(chanVX / chanMass, chanVY / chanMass) : 0);
    st.remnantMass = remM;
    st.residualLength = isFinite(sMax) ? Math.hypot(sMax - sMin, uMax - uMin) : 0;
    st.residualKE = chanKE;
    // "lost" means gone from the domain - promoted to a ballistic fragment or
    // retired - not merely fragmented in place
    st.erodedMass = Math.max(0, this.penetratorMass0() - penMass);
    st.spallMass = spall;
    st.spallCount = freeCount;
    st.fragmentCount = this.fragments.count;
    st.brokenBonds = this.solver.totalBroken;
    st.backfaceBulge = bulge;
    st.peakTemp = hot;

    // through when the deepest coherent node has passed the back face of the
    // last layer, measured along that layer's own normal against its own
    // normal thickness
    // Perforation = a measurable amount of penetrator material got past the
    // back face inside the channel. Testing a single deepest node instead lets
    // one stray fragment call a perforation that did not happen.
    if (!st.perforated && isFinite(deepestLast) && deepestLast > tL) {
      st.perforated = true;
      // freeze the residual state at the moment of break-out: afterwards the
      // remnant simply leaves the meshed corridor and the live counters fall
      st.atPerforation = {
        t: this.simTime, mass: penMass, velocity: st.residualVelocity,
        ke: chanKE, length: st.residualLength, through: massThrough,
        eroded: this.penetratorMass0() - penMass,
        coherent, attached,
        depthNormal: st.maxDepth, depthLOS: st.maxDepthLOS,
      };
      this.log.add(this.simTime, 'perforation',
        `PERFORATION — ${(massThrough * 1000).toFixed(0)} g through the back face at ` +
        `${st.residualVelocity.toFixed(0)} m/s (${(chanKE / 1000).toFixed(0)} kJ in the channel)`,
        SEV.CRITICAL, { ...st.atPerforation });
    }
    // ricochet: penetrator turned away and is leaving without perforating
    if (!st.perforated && chanMass > 0 && st.residualVelocity > 80) {
      const away = (chanVX / chanMass) * n0[0] + (chanVY / chanMass) * n0[1];
      if (away < -30 && !st.ricochet) {
        st.ricochet = true;
        this.log.add(this.simTime, 'ricochet',
          `RICOCHET — remnant deflected at ${st.residualVelocity.toFixed(0)} m/s`, SEV.MAJOR);
      }
    }
    // Debris playback advances world time after the continuum has stopped.
    // Keep that playback duration out of the reported contact-phase clock.
    if (this.state === 'impact' || this.state === 'settle') {
      st.contactTime = this.contactSeen ? this.simTime - this.trueContactTime : 0;
    }
  }

  /**
   * Armour flow strength seen by a ROD relative to the strength seen by a shell
   * (TUNE.plateYield). A shell opens its hole by plugging and shear; a rod by
   * erosion, a regime in which the plane-strain slice over-resists as the rod
   * gets longer (the rod body upsets instead of flowing out of the channel).
   * The factor eases from 1 for a stubby rod to rodTargetYield/plateYield by
   * L/D = 30.
   */

    if (!['apds', 'apfsds'].includes(p.cfg.type)) return 1;
    const d = p.describe();
    const ld = d.length / Math.max(d.penDiameter, 1e-6);
    const k = Math.min(1, Math.max(0, (ld - 6) / 24));
    return 1 + k * (TUNE.rodTargetYield / TUNE.plateYield - 1);
  }

  penetratorMass0() {
    if (this._penMass0 !== undefined && this._penMass0Domain === this.domain) return this._penMass0;
    let m = 0;
    const d = this.domain;
    for (let i = 0; i < d.n; i++) if (d.role[i] === ROLE.PENETRATOR) m += d.mass[i];
    this._penMass0 = m; this._penMass0Domain = this.domain;
    return m;
  }

  snapshotDiagnostics() {

    const st = this.stats;
    return {
      t: this.simTime, state: this.state,
      residualVelocity: st.residualVelocity, residualMass: st.residualMass,
      depth: st.maxDepth, broken: st.brokenBonds,
      ke: s ? s.kinetic() : (this.projectile ? this.projectile.ke : 0),
      plastic: s ? s.energy.plastic : 0,

      residualVelocity: st.atPerforation ? st.atPerforation.velocity : st.residualVelocity,
      residualMass: st.atPerforation ? st.atPerforation.mass : st.residualMass,

      audit: this.solver ? this.solver.energyAudit() : null,
      contactTime: st.contactTime,
    };
  }

  // ---------------------------------------------------------- save / load

  toJSON() {
    return {
      version: 1,
      name: this.scene.name,
      projectile: this.projectileCfg,
      scene: this.scene.toJSON(),
      settings: { ...this.settings },
    };

  loadJSON(j) {

            count: n,
            cam: this.cam,
            mode: this.opts.field,
            pointSize: Math.min(Math.max(size * 0.8, 2), this.field.maxPointSize),
            extrude: null,
            alpha: 1,
            onlyFree: true,
            skipUpload: true,
          });
          return;
        }
      }
    }
    this.field.drawPoints({
      count: n,
      cam: this.cam,
      mode: this.opts.field,
      pointSize: Math.min(size, this.field.maxPointSize),
      extrude: this.nodeExtrudeVec(size),
      alpha: 1,
    });
  }

  // ------------------------------------------------------------------ grid

  drawGrid() {
    const ctx = this.ctx, cam = this.cam;
    // choose a spacing that lands between 60 and 220 px
    let step = 0.001;
    const nice = [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5];
    for (const s of nice) { step = s; if (s * cam.scale > 60) break; }
    const [wx0, wy1] = cam.toWorld(0, 0);
    const [wx1, wy0] = cam.toWorld(cam.w, cam.h);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = Math.floor(wx0 / step) * step; x < wx1; x += step) {
      const [sx] = cam.toScreen(x, 0);
      ctx.moveTo(sx, 0); ctx.lineTo(sx, cam.h);
    }
    for (let y = Math.floor(wy0 / step) * step; y < wy1; y += step) {
      const [, sy] = cam.toScreen(0, y);
      ctx.moveTo(0, sy); ctx.lineTo(cam.w, sy);
    }
    ctx.strokeStyle = UI.grid; ctx.stroke();

    // scale bar
    const px = step * cam.scale;
    const label = step >= 1 ? `${step} m` : `${Math.round(step * 1000)} mm`;
    ctx.save();
    ctx.translate(18 * this.dpr, cam.h - 26 * this.dpr);
    ctx.strokeStyle = UI.dim; ctx.lineWidth = 1.5 * this.dpr;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(px, 0);
    ctx.moveTo(0, -5 * this.dpr); ctx.lineTo(0, 5 * this.dpr);
    ctx.moveTo(px, -5 * this.dpr); ctx.lineTo(px, 5 * this.dpr);
    ctx.stroke();
    ctx.fillStyle = UI.dim;
    ctx.font = `${11 * this.dpr}px ui-monospace, monospace`;
    ctx.fillText(label, 2 * this.dpr, -8 * this.dpr);
    ctx.restore();
  }

  // ------------------------------------------------------------ scene solids

  /** Extrusion offset in pixels for the 2.5-D look on scene-scale solids. */
  extrudeVec() {
    if (!this.opts.extrude) return [0, 0];
    const d = clamp(this.cam.scale * 0.015, 3, 22) * this.dpr;
    return [d * 0.55, -d * 0.42];
  }

  /**
   * Extrusion for the node field. It has to scale with the *node* size, not
   * with the zoom: a scene-sized offset applied per node smears the whole body
   * into a dark ghost instead of giving it thickness.
   */
  nodeExtrudeVec(size) {
    if (!this.opts.extrude) return [0, 0];
    const d = clamp(size * 0.42, 0.8, 7 * this.dpr);
    return [d * 0.8, -d * 0.62];
  }

  polyPath(poly) {
    const ctx = this.ctx, cam = this.cam;
    ctx.beginPath();
    for (let i = 0; i < poly.length; i += 2) {
      const [sx, sy] = cam.toScreen(poly[i], poly[i + 1]);
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.closePath();
  }

  drawScene(world) {
    const ctx = this.ctx;
    const [ex, ey] = this.extrudeVec();
    const dom = world.domain;
    // The static plate and the corridor are one decision, not two: drawing the
    // undeformed plate inside the corridor would paint intact armour straight
    // over the channel the solver opened, which is the renderer contradicting
    // the simulation. The far field is therefore CLIPPED to lie outside the
    // corridor, rather than painted and then punched out - a punch-out leaves
    // an anti-aliased hairline of background along every cut edge, which is
    // the seam that used to run across the plate.
    if (!this.opts.showFarField) return;
    ctx.save();
    if (dom) {
      // Clip to everything except the corridor's lateral band, pulled in by the
      // width of the CLAMPED rows at each corridor edge. Those rows are held at
      // their reference positions by the boundary condition, so inside that
      // margin the meshed plate is by construction identical to the undeformed
      // plate: drawing the exact far-field geometry there shows the same thing
      // the nodes would, with the true face lines instead of a lattice
      // staircase, and it means the seam between the two never falls on an
      // anti-aliased node contour. Only the lateral edges are inset: the front
      // and back faces of the corridor are the real surfaces of the plate and
      // must stay clear, or an opened channel would have intact armour behind it.
      ctx.beginPath();
      ctx.rect(0, 0, this.cam.w, this.cam.h);
      this.corridorPath(dom, this.edgeMargin(dom), true);
      ctx.clip('evenodd');
    }
    for (const L of world.scene.activeLayers()) {
      const lit = this.farFieldColour(L);

      // back face (extruded depth): the node surface's own dark copy is the
      // lit colour at half brightness, so the two must be drawn the same way
      if (this.opts.extrude) {
        ctx.save();
        ctx.translate(ex, ey);
        this.polyPath(L.poly);
        ctx.fillStyle = shade(lit, 0.5);
        ctx.fill();
        ctx.restore();
      }

      // front face: flat, in exactly the colour an undamaged node is drawn in,
      // so the corridor and the far field read as one plate
      this.polyPath(L.poly);
      ctx.fillStyle = rgb(lit.map((v) => Math.round(v)));
      ctx.fill();

      if (this.selection && this.selection.kind === 'layer' && this.selection.id === L.id) {
        ctx.lineWidth = 2.5 * this.dpr;
        ctx.strokeStyle = UI.accent;
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /** Width, in metres, of the clamped rows at each lateral corridor edge. */
  edgeMargin(d) {
    return Math.min(d.delta * 0.8, d.width * 0.25);
  }

  /** The colour an undamaged node of this layer's material is drawn in. */
  farFieldColour(L) {
    const base = this.matColor(L.mat.color);
    return [Math.min(255, base[0] * 1.14), Math.min(255, base[1] * 1.14), Math.min(255, base[2] * 1.14)];
  }

  polyGradient(poly, base, dark) {
    const ctx = this.ctx, cam = this.cam;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < poly.length; i += 2) {
      x0 = Math.min(x0, poly[i]); x1 = Math.max(x1, poly[i]);
      y0 = Math.min(y0, poly[i + 1]); y1 = Math.max(y1, poly[i + 1]);
    }
    const [sx0, sy0] = cam.toScreen(x0, y1);
    const [sx1, sy1] = cam.toScreen(x1, y0);
    const g = ctx.createLinearGradient(sx0, sy0, sx1, sy1);
    g.addColorStop(0, shade(base, 1.12));
    g.addColorStop(0.55, rgb(base));
    g.addColorStop(1, shade(dark, 1.0));
    return g;
  }

  /**
   * The corridor rectangle. `inset` pulls the two lateral edges in by that many
   * metres; `append` adds it as a sub-path to whatever path is already open
   * instead of starting a new one (needed to build an even-odd clip).
   */
  corridorPath(d, inset = 0, append = false) {
    const ctx = this.ctx, cam = this.cam;
    const hw = d.width / 2 - inset;
    const pts = [
      [d.ox + d.bx * -hw, d.oy + d.by * -hw],
      [d.ox + d.ax * d.length + d.bx * -hw, d.oy + d.ay * d.length + d.by * -hw],
      [d.ox + d.ax * d.length + d.bx * hw, d.oy + d.ay * d.length + d.by * hw],
      [d.ox + d.bx * hw, d.oy + d.by * hw],
    ];
    if (!append) ctx.beginPath();
    pts.forEach((p, i) => {
      const [sx, sy] = cam.toScreen(p[0], p[1]);
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    });
    ctx.closePath();
  }

  drawModules(world) {
    const ctx = this.ctx;
    const [ex, ey] = this.extrudeVec();
    for (const m of world.scene.modules) {
      const spec = MODULE_TYPES[m.type] || MODULE_TYPES.void;
      const poly = modulePoly(m);
      const c = this.matColor(spec.color);
      if (this.opts.extrude) {
        ctx.save(); ctx.translate(ex, ey);
        this.polyPath(poly); ctx.fillStyle = shade(c, 0.35); ctx.fill();
        ctx.restore();
      }
      this.polyPath(poly);
      const a = m.state === 'destroyed' ? 0.30 : m.state === 'damaged' ? 0.55 : 0.8;
      ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${a * 0.55})`;
      ctx.fill();
      ctx.lineWidth = (this.selection && this.selection.kind === 'module' && this.selection.id === m.id ? 2.5 : 1.2) * this.dpr;
      ctx.strokeStyle = this.selection && this.selection.kind === 'module' && this.selection.id === m.id
        ? UI.accent : `rgba(${c[0]},${c[1]},${c[2]},0.95)`;
      ctx.stroke();

      if (m.state !== 'ok') {
        ctx.save();
        this.polyPath(poly); ctx.clip();
        ctx.strokeStyle = m.state === 'destroyed' ? UI.danger : UI.warn;
        ctx.lineWidth = 1.2 * this.dpr;
        const [bx0, by0] = this.cam.toScreen(m.x - m.w, m.y - m.h);
        const [bx1, by1] = this.cam.toScreen(m.x + m.w, m.y + m.h);
        ctx.beginPath();
        for (let x = Math.min(bx0, bx1); x < Math.max(bx0, bx1); x += 9 * this.dpr) {
          ctx.moveTo(x, Math.min(by0, by1)); ctx.lineTo(x + 60 * this.dpr, Math.max(by0, by1));
        }
        ctx.stroke();
        ctx.restore();
      }

      if (this.cam.scale > 200) {
        const [lx, ly] = this.cam.toScreen(m.x, m.y);
        ctx.fillStyle = UI.ink;
        ctx.font = `${10 * this.dpr}px ui-monospace, monospace`;
        ctx.textAlign = 'center';
        ctx.fillText(m.label || spec.label, lx, ly);
        ctx.textAlign = 'left';
      }
    }
  }

  // ------------------------------------------------------- peridynamic field

  nodeColor(d, i, frame) {
    const mode = this.opts.field;
    const dmg = frame ? frame.dmg[i] / 255 : d.damage[i];
    // ERA DETONATION PRODUCTS
    // The charge keeps its mass when it functions (sim/era.js) but it is gas,
    // not plate. Coloured by material and darkened by damage - which is 1.0,
    // since every bond on it is broken - it rendered as near-black and the
    // detonation was invisible: the cassette went off and nothing on screen
    // said so. It is drawn here as hot gas cooling as it disperses. The
    // brightness is the node's own speed, so this is simulation state being
    // displayed, not an effect played over the top.
    const isGas = frame ? (frame.alv && (frame.alv[i] & 4)) : (d.flags[i] & 16);
    if (isGas && (mode === 'material' || mode === 'damage')) {
      const sp = frame
        ? (frame.vel ? frame.vel[i] / 255 : 0.5)
        : Math.hypot(d.vx[i], d.vy[i]) / 900;
      const g = clamp(sp, 0, 1);
      return [255, 90 + 150 * g, 30 + 70 * g];
    }
    switch (mode) {
      case 'damage': return RAMP_DAMAGE(dmg);
      case 'plastic': {
        const pd = d.matTable[d.matIndex[i]].pd;
        return RAMP_PLASTIC(clamp(d.plStrain[i] / Math.max(pd.epsF * 3, 1e-4), 0, 1));
      }
      case 'temp': {
        const t = frame ? 293 + frame.tmp[i] * 8 : d.temp[i];
        return RAMP_TEMP(clamp((t - 293) / 1200, 0, 1));
      }
      case 'velocity': {
        const v = Math.hypot(d.vx[i], d.vy[i]);
        return RAMP_VELOCITY(clamp(v / this.opts.velScale, 0, 1));
      }
      case 'stress':
        return RAMP_STRESS(clamp(0.5 + d.virial[i] / (2 * this.opts.stressScale), 0, 1));
      case 'material':
      default: {
        const m = d.matTable[d.matIndex[i]].mat;
        const base = this.matColor(m.color);
        // undamaged material is drawn a little brighter than its flat swatch so
        // the meshed corridor reads as the same plate as the static far field
        const f = 1.14 - 0.72 * dmg;
        return [Math.min(255, base[0] * f), Math.min(255, base[1] * f), Math.min(255, base[2] * f)];
      }
    }
  }

  drawNodes(world, frame) {
    const ctx = this.ctx, cam = this.cam;
    const d = world.domain;
    const px = frame ? frame.px : d.px;
    const py = frame ? frame.py : d.py;
    const alv = frame ? frame.alv : null;
    const n = frame ? frame.n : d.n;
    const size = Math.max(1, d.dx * cam.scale * this.opts.nodeGain * 1.42);
    const half = size / 2;
    const [ex, ey] = this.nodeExtrudeVec(size);

    // cull to viewport
    const margin = size * 2;
    const inView = (sx, sy) => sx > -margin && sy > -margin && sx < cam.w + margin && sy < cam.h + margin;

    // pass 1: extruded depth — a single dark silhouette behind everything
    if (this.opts.extrude && size > 2) {
      ctx.save();
      ctx.translate(ex, ey);
      ctx.fillStyle = 'rgba(6,9,14,0.6)';
      for (let i = 0; i < n; i++) {
        if (alv ? !(alv[i] & 1) : !d.alive[i]) continue;
        const [sx, sy] = cam.toScreen(px[i], py[i]);
        if (!inView(sx, sy)) continue;
        ctx.fillRect(sx - half, sy - half, size, size);
      }
      ctx.restore();
    }

    // pass 2: the field itself
    // Bucket by quantised colour so long runs share a fillStyle: with several
    // thousand nodes the style changes, not the rectangles, dominate the cost.
    const buckets = new Map();
    for (let i = 0; i < n; i++) {
      if (alv ? !(alv[i] & 1) : !d.alive[i]) continue;
      const [sx, sy] = cam.toScreen(px[i], py[i]);
      if (!inView(sx, sy)) continue;
      const c = this.nodeColor(d, i, frame);
      const key = ((c[0] >> 3) << 10) | ((c[1] >> 3) << 5) | (c[2] >> 3);
      let arr = buckets.get(key);
      if (!arr) { arr = { c, pts: [] }; buckets.set(key, arr); }
      arr.pts.push(sx, sy);
    }
    for (const b of buckets.values()) {
      ctx.fillStyle = rgb([b.c[0] | 0, b.c[1] | 0, b.c[2] | 0]);
      const p = b.pts;
      for (let k = 0; k < p.length; k += 2) ctx.fillRect(p[k] - half, p[k + 1] - half, size, size);
    }

    // detached material gets a rim so spall reads as separate from the body
    if (size > 2.5) {
      ctx.strokeStyle = 'rgba(255,190,120,0.35)';
      ctx.lineWidth = Math.max(1, this.dpr * 0.8);
      ctx.beginPath();
      let count = 0;
      for (let i = 0; i < n && count < 3000; i++) {
        const free = alv ? (alv[i] & 2) : (d.flags[i] & 8);
        if (!free) continue;
        if (alv ? !(alv[i] & 1) : !d.alive[i]) continue;
        const [sx, sy] = cam.toScreen(px[i], py[i]);
        if (!inView(sx, sy)) continue;
        ctx.rect(sx - half, sy - half, size, size);
        count++;
      }
      ctx.stroke();
    }

  }

  drawVectors(world, frame) {
    const ctx = this.ctx, cam = this.cam;
    const d = world.domain;
    const px = frame ? frame.px : d.px, py = frame ? frame.py : d.py;
    const stride = Math.max(1, Math.round(d.n / 900));
    const k = 0.00012 * cam.scale;
    ctx.strokeStyle = 'rgba(120,220,255,0.55)';
    ctx.lineWidth = 1 * this.dpr;
    ctx.beginPath();
    for (let i = 0; i < d.n; i += stride) {
      if (!d.alive[i]) continue;
      const v = Math.hypot(d.vx[i], d.vy[i]);
      if (v < 25) continue;
      const [sx, sy] = cam.toScreen(px[i], py[i]);
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + d.vx[i] * k, sy - d.vy[i] * k);
    }
    ctx.stroke();
  }

  // -------------------------------------------------------------- fragments

  fragmentColor(a, vx, vy) {
    let c;
    switch (this.opts.field) {
      case 'damage': c = RAMP_DAMAGE(a.damage); break;
      case 'plastic': c = RAMP_PLASTIC(clamp(a.plastic, 0, 1)); break;
      case 'temp': c = RAMP_TEMP(clamp((a.temp - 293) / FIELD_SCALES.tempSpan, 0, 1)); break;
      case 'velocity': c = RAMP_VELOCITY(clamp(Math.hypot(vx, vy) / this.opts.velScale, 0, 1)); break;
      case 'stress': c = RAMP_STRESS(clamp(0.5 + a.stress / (2 * this.opts.stressScale), 0, 1)); break;
      default: {
        const factor = 1.14 - 0.72 * clamp(a.damage, 0, 1);
        c = this.matColor(a.materialColor).map((v) => v * factor);
      }
    }
    // Match the GPU's detached-node tint when that was the source view.
    if (this.lastPathGL && a.detached) c = [c[0] * 1.255, c[1] * 1.034, c[2] * 0.762];
    return rgb(c.map((v) => Math.round(clamp(v, 0, 255))));
  }

  drawFragments(world, frame) {
    const ctx = this.ctx, cam = this.cam;
    const list = frame ? frame.frags : world.fragments.list;
    if (!list || !list.length) return;

    // MOTION STREAKS
    // A fragment's trail used to be drawn as the polyline of its last dozen
    // recorded positions. Once loose material is flown ballistically a
    // fragment covers metres per step, so those polylines became long straight
    // needles with no fragment at the end of them (it was already off the
    // screen), and in replay nothing was drawn at all. A streak is now a short
    // tail along the fragment's own velocity: the length is the distance flown
    // in up to 0.4 ms of exposure, bounded by actual motion this frame. A new
    // particle has no past trajectory, and a finished view has no motion blur.
    if (this.opts.showTrails && (frame ? frame.state : world.state) !== 'done') {
      const cap = 26 * this.dpr, expo = 4e-4;
      const buckets = [[], [], []];                       // faint, mid, bright
      for (const f of list) {
        if (!frame && !f.alive) continue;
        const vx = frame ? f[2] : f.vx, vy = frame ? f[3] : f.vy;
        const v = Math.hypot(vx, vy);
        if (v < 60) continue;                             // resting or sliding: no streak
        const [sx, sy] = cam.toScreen(frame ? f[0] : f.x, frame ? f[1] : f.y);
        if (sx < -cap || sy < -cap || sx > cam.w + cap || sy > cam.h + cap) continue;
        const distance = frame ? (f[7] || 0) : (f.motionDistance || 0);
        const len = Math.min(cap, v * expo * cam.scale, distance * cam.scale);
        if (len < 2) continue;
        const ux = vx / v, uy = -vy / v;                  // screen y points down
        const bk = v > 900 ? 2 : v > 350 ? 1 : 0;
        buckets[bk].push(sx, sy, sx - ux * len, sy - uy * len);
      }
      ctx.lineCap = 'round';
      ctx.lineWidth = 1.1 * this.dpr;
      const style = ['rgba(220,160,90,0.16)', 'rgba(230,170,100,0.30)', 'rgba(255,200,130,0.48)'];
      for (let bk = 0; bk < 3; bk++) {
        const q = buckets[bk];
        if (!q.length) continue;
        ctx.strokeStyle = style[bk];
        ctx.beginPath();
        for (let k = 0; k < q.length; k += 4) { ctx.moveTo(q[k], q[k + 1]); ctx.lineTo(q[k + 2], q[k + 3]); }
        ctx.stroke();
      }
      ctx.lineCap = 'butt';
    }

    for (const f of list) {
      const x = frame ? f[0] : f.x, y = frame ? f[1] : f.y;
      const vx = frame ? f[2] : f.vx, vy = frame ? f[3] : f.vy;
      const sz = frame ? f[5] : f.size;
      const kind = frame ? f[6] : f.kind;
      const appearance = frame ? f[8] : f.appearance;
      if (!frame && (!f.alive)) continue;
      const [sx, sy] = cam.toScreen(x, y);
      if (sx < -20 || sy < -20 || sx > cam.w + 20 || sy > cam.h + 20) continue;
      const freePoint = this.lastPathGL && this.opts.smooth && this.field?.smoothOK && appearance?.detached;
      const s = appearance
        ? Math.max(freePoint ? 2 : 1, appearance.nodeSize * cam.scale * this.opts.nodeGain * 1.42 * (freePoint ? 0.8 : 1))
        : Math.max(1.4, sz * cam.scale);
      const v = Math.hypot(vx, vy);
      const hot = clamp(v / 1400, 0, 1);
      ctx.fillStyle = appearance ? this.fragmentColor(appearance, vx, vy) : kind === 'penetrator'
        ? `rgb(${190 + 60 * hot | 0},${170},${150})`
        : kind === 'sabot' ? 'rgb(150,160,170)'
          : `rgb(${200 + 55 * hot | 0},${140 + 70 * hot | 0},${70})`;
      ctx.fillRect(sx - s / 2, sy - s / 2, s, s);
    }
  }

  // ------------------------------------------------------------- projectile

  drawProjectile(world, frame) {
    const p = world.projectile;
    if (!p) return;
    const inFlight = frame ? !!frame.proj : (world.state === 'flight' || world.state === 'idle');
    if (!inFlight) return;
    const ctx = this.ctx;
    const st = frame ? frame.proj : p;
    const [ex, ey] = this.extrudeVec();

    const sabotAttached = frame ? st.sabot : p.sabotAttached;
    const parts = p.parts.filter((q) => !(q.sabot && !sabotAttached));
    // The mesher gives the first part ownership of overlaps. APHE is always
    // a section view: draw its outer body first and its existing cavity last.
    if (p.type.key === 'aphe') parts.reverse();
    for (const pass of (this.opts.extrude ? [0, 1] : [1])) {
      ctx.save();
      try {
        if (pass === 0) ctx.translate(ex, ey);
        for (const q of parts) {
          const c = this.matColor(q.mat.color);
          const poly = p.worldPoly(q.poly, st);
          this.polyPath(poly);
          ctx.fillStyle = pass === 0 ? shade(c, 0.35) : this.polyGradient(poly, c, this.matColor(q.mat.color2 || q.mat.color));
          ctx.fill();
          if (pass === 1) {
            ctx.lineWidth = 1 * this.dpr;
            ctx.strokeStyle = shade(c, 1.4);
            ctx.stroke();
          }
        }
        if (pass === 1 && p.type.key === 'aphe') {
          for (const q of apheSectionDetails(p)) {
            const poly=p.worldPoly(q.poly,st);
            this.polyPath(poly);
            ctx.fillStyle=this.polyGradient(poly,this.matColor(q.color),this.matColor(q.dark));
            ctx.fill();
          }
        }
      } finally { ctx.restore(); }
    }
  }

  // ---------------------------------------------------------------- overlays

  drawOverlays(world) {
    const ctx = this.ctx, cam = this.cam;

    if (this.opts.showCorridor && world.domain) {
      this.corridorPath(world.domain);
      ctx.setLineDash([6 * this.dpr, 5 * this.dpr]);
      ctx.strokeStyle = UI.corridor;
      ctx.lineWidth = 1.5 * this.dpr;
      ctx.stroke();
      ctx.setLineDash([]);
      const [tx, ty] = cam.toScreen(world.domain.ox, world.domain.oy + world.domain.width / 2);
      ctx.fillStyle = UI.corridor;
      ctx.font = `${10 * this.dpr}px ui-monospace, monospace`;
      ctx.fillText('continuum domain', tx + 6 * this.dpr, ty - 6 * this.dpr);

/** Tiny DOM helpers — enough structure to keep the panel code readable. */

function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'style') n.setAttribute('style', v);
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (k === 'html') n.innerHTML = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    n.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return n;
}

/**
 * Collapsed state lives outside the DOM so panels survive the periodic
 * rebuilds that keep the readouts live during a run.
 */
const panelState = new Map();

function panel(title, opts = {}) {
  const body = el('div', { class: 'body' });
  const tag = el('span', { class: 'tag' }, opts.tag || '');
  const head = el('h3', {}, title, tag);
  const collapsed = panelState.has(title) ? panelState.get(title) : !!opts.collapsed;
  const root = el('div', { class: `panel${collapsed ? ' collapsed' : ''}` }, head, body);
  head.addEventListener('click', () => {
    root.classList.toggle('collapsed');
    panelState.set(title, root.classList.contains('collapsed'));
  });
  root.body = body; root.tagEl = tag;

}

}

function readout(label, id) {

 * ===================
 *
 * A catalogue of real tank rounds, WW2 to modern, as projectile configurations.

 * back to back. This is deliberately separate from the scenario presets, which

 *     ballistics here, so every round is being fired at point blank. A round

 *   - Sub-calibre rod dimensions (`rodD`, `rodLd`) are rarely published for
 *     anything modern. Where they are not, they are inferred from the quoted
 *     projectile mass and the core material's density at a plausible L/D. They
 *     are consistent with the mass, which is what the simulation actually
 *     integrates, but they are not the real rod.
 *   - Core materials are the usual class for the round's generation - steel,
 *     tungsten carbide, tungsten heavy alloy, depleted uranium - not a

__def("src/core/units.js", function (__exports, __req) {
/**
 * Display formatting. The solver is strictly SI; only these helpers convert.
 */

const sub = (v, digits) => (Math.abs(v) >= 100 ? v.toFixed(0)
  : Math.abs(v) >= 10 ? v.toFixed(Math.min(1, digits))
    : v.toFixed(digits));

const mm = (m, d = 1) => `${sub(m * 1000, d)} mm`;
const mmv = (m) => m * 1000;
const cm = (m, d = 1) => `${sub(m * 100, d)} cm`;

function len(m, d = 1) {
  const a = Math.abs(m);
  if (a < 0.001) return `${(m * 1e6).toFixed(0)} µm`;
  if (a < 1) return `${sub(m * 1000, d)} mm`;
  return `${sub(m, d + 1)} m`;
}

function vel(v, d = 0) { return `${v.toFixed(d)} m/s`; }

function mass(kg) {
  const a = Math.abs(kg);
  if (a < 1e-3) return `${(kg * 1e6).toFixed(1)} mg`;
  if (a < 1) return `${(kg * 1000).toFixed(1)} g`;
  return `${kg.toFixed(3)} kg`;
}

function energy(j) {
  const a = Math.abs(j);
  if (a < 1000) return `${j.toFixed(0)} J`;
  if (a < 1e6) return `${(j / 1e3).toFixed(1)} kJ`;
  return `${(j / 1e6).toFixed(2)} MJ`;
}

function pressure(pa) {
  const a = Math.abs(pa);
  if (a < 1e6) return `${(pa / 1e3).toFixed(0)} kPa`;
  if (a < 1e9) return `${(pa / 1e6).toFixed(0)} MPa`;
  return `${(pa / 1e9).toFixed(2)} GPa`;
}

function time(s) {

 * =======================================================
 *
 * The simulation cost is set by the node budget and the number of CFL
 * sub-steps evaluated per frame. Neither may be lowered on capable hardware
 * just because the hardware is a phone — an iPhone 17 Pro runs this comfortably
 * at the same discretisation a laptop does.
 *
 * WHY A BENCHMARK RATHER THAN USER-AGENT SNIFFING
 * ----------------------------------------------
 * Safari does not expose `navigator.deviceMemory`, reports the same
 * `hardwareConcurrency` on a five-year-old iPhone as on a current one, and
 * freezes its user-agent string. Every static signal available is either
 * absent or useless for ranking Apple silicon. So the tier is *measured*: a
 * short, representative floating-point loop over a typed array — the same
 * shape of work the solver's bond loop does — is timed at start-up and the
 * throughput decides the tier. That ranks any device correctly, including
 * hardware that did not exist when this was written.
 *
 * The measurement is then continuously corrected by the governor, which
 * watches real frame times and moves the pixel ratio and sub-step count within
 * the tier. The *physics* is never altered by either: the node budget and
 * discretisation come from the tier, and the tier only ever drops if the
 * device genuinely cannot sustain the frame.
 */

const TIERS = {
  high: {
    key: 'high',
    label: 'High — modern flagship',
    quality: 'high',
    dprCap: 2.75,
    minFrameMs: 9,
    maxFrameMs: 19,
    note: 'Full discretisation, GPU node field, device pixel ratio up to 2.75.',
  },
  balanced: {
    key: 'balanced',
    label: 'Balanced',
    quality: 'normal',
    dprCap: 2.0,
    minFrameMs: 10,
    maxFrameMs: 22,
    note: 'Default discretisation, GPU node field, pixel ratio capped at 2.',
  },
  fallback: {
    key: 'fallback',
    label: 'Fallback — older or throttled device',
    quality: 'low',
    dprCap: 1.5,
    minFrameMs: 12,
    maxFrameMs: 30,
    note: 'Coarser lattice and fewer sub-steps. Same solver and same model — '
      + 'the event simply plays out over more frames.',
  },
};

const TIER_ORDER = ['high', 'balanced', 'fallback'];

/**
 * Timed micro-benchmark shaped like the solver's inner loop: strided reads
 * from typed arrays, a square root, a few multiply-adds, a scattered write.
 * Returns millions of iterations per second.
 */
function benchmark(budgetMs = 12) {
  const N = 1 << 14;

  const bx = new Float32Array(N), out = new Float32Array(N);

    ax[i] = Math.sin(i) * 0.01; ay[i] = Math.cos(i) * 0.01; bx[i] = 1 + (i % 7) * 0.1;
  }

 * Pick a starting tier from the measured throughput.

 * recoverable, because the governor trims pixel ratio and sub-steps within a
 * frame or two and the between-run review (see Governor.reviewAfterRun) drops

/**
 * Runtime governor.
 *
 * Watches the real frame interval and trims the two things that can be trimmed
 * without touching the model: the render pixel ratio and the number of solver
 * sub-steps per frame. It never changes the lattice, the material model or the
 * time step, so a governed run and an ungoverned one are the same simulation —
 * one simply advances less simulated time per frame.
 */

  constructor(device) {

    this.spec = device.tierSpec;

    this.samples = 0;
    this.cooldown = 0;
    this.enabled = true;
    this.history = [];
  }

  setTier(key) {

    this.cooldown = 60;
  }

  /** Effective device pixel ratio for the canvases. */
  pixelRatio() {
    return Math.max(1, Math.min(window.devicePixelRatio || 1, this.spec.dprCap) * this.dprScale);
  }

  /**
   * @param {number} frameMs wall-clock interval of the last frame
   * @returns {boolean} true if the pixel ratio changed and canvases must resize
   */
  update(frameMs) {

   * The governor can only trim pixel ratio and sub-steps; the node budget is
   * fixed for the life of a mesh, so it can only be changed between runs. This
   * is where a device that turned out to be faster or slower than the start-up
   * benchmark suggested gets moved. Called on FIRE, so the tier never changes
   * part-way through an impact.
   *
   * The decisive signal is not the solver's cost per frame — once the
   * sub-step governor has clamped down, a struggling device reports a *cheap*
   * frame because it is barely advancing the solution. What matters is whether
   * the device could sustain the sub-step count the tier asks for.

   * @param {number} solverMs   mean solver cost per frame during the last impact

      score: this.device.score,
      fps: this.avg > 0 ? 1000 / this.avg : 0,
      dpr: this.pixelRatio(),
      backend: this.device.webgl2 ? 'WebGL 2' : this.device.webgl ? 'WebGL 1' : 'Canvas 2D',

}
