<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0d12'/%3E%3Crect x='18' y='4' width='7' height='24' fill='%237d8798'/%3E%3Cpath d='M4 16 L13 12 L13 20 Z' fill='%23d8564a'/%3E%3C/svg%3E">
<meta name="description" content="Real-time peridynamic terminal-ballistics simulator: deformable armour, dynamic projectiles, penetration, spall and internal damage, all driven by the solver.">
<meta name="theme-color" content="#0a0d12">
<link rel="manifest" href="./manifest.webmanifest">
<!-- iOS home-screen install: black-translucent puts the app under the status
     bar, which the safe-area padding below already accounts for. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ballistics">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<!-- single-file build: run tools/build.mjs to regenerate -->
<title>Terminal Ballistics Sandbox — deformable armour / dynamic projectile simulation</title>
<style>
:root{
  --bg:#0a0d12; --bg2:#11151c; --panel:#141922; --panel2:#1b212c;
  --edge:#252d3a; --edge2:#323b4b;
  --ink:#d6dde6; --ink2:#98a3b2; --dim:#6d7787;
  --accent:#4fb0d8; --accent2:#2b6f8c;
  --warn:#e0a23c; --danger:#d8564a; --ok:#5fbf7f;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --row:26px;
}
*{margin:0;padding:0;box-sizing:border-box}
/* 100dvh tracks mobile Safari's collapsing URL bar; the -webkit-fill-available
   line is the fallback for older iOS that predates dvh units. */
html,body{height:100%;height:-webkit-fill-available;height:100dvh;
  overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:var(--mono);font-size:12px;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;
  touch-action:manipulation}

#app{display:grid;height:100%;height:100dvh;
  grid-template-columns:var(--lw,280px) 1fr var(--rw,320px);
  grid-template-rows:40px 1fr;
  grid-template-areas:"top top top" "left main right";}

/* ---------------------------------------------------------------- topbar */
#top{grid-area:top;display:flex;align-items:center;gap:8px;
  padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));
  background:linear-gradient(180deg,#161c25,#10151d);border-bottom:1px solid var(--edge);
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{font-weight:700;letter-spacing:.5px;color:var(--ink);flex:0 0 auto}
.brand small{color:var(--dim);font-weight:400;letter-spacing:0}
.sep{width:1px;height:22px;background:var(--edge2);flex:0 0 auto}
.spacer{flex:1 1 auto}

button{background:var(--panel2);border:1px solid var(--edge2);border-radius:4px;
  padding:5px 9px;cursor:pointer;color:var(--ink2);line-height:1;flex:0 0 auto}
button:hover{background:#232c39;color:var(--ink)}
button:active{transform:translateY(1px)}
button.on{background:var(--accent2);border-color:var(--accent);color:#eaf6fb}
button.fire{background:#7a2a22;border-color:#b4483a;color:#ffd9d2;font-weight:700;letter-spacing:1px;padding:6px 16px}
button.fire:hover{background:#94332a}
button:disabled{opacity:.35;cursor:default}
button.icon{min-width:30px;text-align:center;font-size:13px}

.readout{display:flex;flex-direction:column;line-height:1.15;flex:0 0 auto;padding:0 4px}
.readout b{font-size:12px;color:var(--ink);font-weight:600}
.readout span{font-size:9px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}

/* ------------------------------------------------------------- side rails */
aside{background:var(--panel);overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin}
aside::-webkit-scrollbar{width:8px}
aside::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:4px}
#left{grid-area:left;border-right:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}
#right{grid-area:right;border-left:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}

.panel{border-bottom:1px solid var(--edge)}
.panel>h3{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;
  background:#171d26;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;
  color:var(--ink2);font-weight:600;position:sticky;top:0;z-index:2}
.panel>h3::before{content:"▾";font-size:9px;color:var(--dim);transition:transform .12s}
.panel.collapsed>h3::before{transform:rotate(-90deg)}
.panel.collapsed>.body{display:none}
.panel>h3 .tag{margin-left:auto;color:var(--dim);font-size:9px;letter-spacing:0;text-transform:none}
.body{padding:8px 10px 10px}

.row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;
  min-height:var(--row);padding:1px 0}
.row>label{color:var(--ink2);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.row .val{color:var(--ink);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1/-1;width:100%;height:16px;accent-color:var(--accent);background:none}
.rowfull{display:block;padding:2px 0}
input[type=number],input[type=text],select{background:#0d1119;border:1px solid var(--edge2);
  border-radius:3px;padding:3px 5px;width:88px;text-align:right;font-variant-numeric:tabular-nums}
select{width:100%;text-align:left}
input:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.hint{color:var(--dim);font-size:10px;line-height:1.45;margin:4px 0 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}

/* ------------------------------------------------------------------ main */
#main{grid-area:main;position:relative;background:var(--bg);display:flex;flex-direction:column;min-width:0}
#view{flex:1 1 auto;position:relative;min-height:0;touch-action:none}
#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
canvas#viewport{cursor:crosshair}
/* the upper layers are painted over the base but must not steal the pointer:
   all gestures are handled on the base canvas */
canvas#viewportField,canvas#viewportFx{pointer-events:none}

#hud{position:absolute;left:10px;top:10px;pointer-events:none;
  display:flex;flex-direction:column;gap:3px}
.chip{background:rgba(12,16,22,.82);border:1px solid var(--edge2);border-radius:3px;
  padding:3px 7px;font-size:10.5px;color:var(--ink2);pointer-events:auto;
  font-variant-numeric:tabular-nums;backdrop-filter:blur(3px)}
.chip b{color:var(--ink)}
.chip.alert{border-color:var(--danger);color:#ffd0c8}

#legend{position:absolute;right:10px;top:10px;background:rgba(12,16,22,.82);
  border:1px solid var(--edge2);border-radius:3px;padding:6px 8px;font-size:10px;color:var(--ink2);
  backdrop-filter:blur(3px);max-width:200px}
#legend .bar{height:8px;border-radius:2px;margin:4px 0 3px;
  background:linear-gradient(90deg,var(--l0),var(--l1),var(--l2),var(--l3),var(--l4))}
#legend .ends{display:flex;justify-content:space-between;color:var(--dim);font-size:9px}

/* ------------------------------------------------------------- transport */
#transport{flex:0 0 auto;border-top:1px solid var(--edge);background:#12171f;
  padding:5px max(8px,env(safe-area-inset-right)) max(5px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#transport::-webkit-scrollbar{display:none}
#scrub{flex:1 1 220px;min-width:120px;accent-color:var(--accent);height:18px}
#tlabel{color:var(--dim);font-size:10px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------------ misc */
.layer{border:1px solid var(--edge2);border-radius:4px;margin-bottom:6px;background:#101620}
.layer.sel{border-color:var(--accent)}
.layer .lh{display:flex;align-items:center;gap:5px;padding:4px 6px;background:#161d27;cursor:pointer}
.layer .lh .sw{width:11px;height:11px;border-radius:2px;border:1px solid rgba(255,255,255,.2);flex:0 0 auto}
.layer .lh .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.layer .lh .th{color:var(--dim);font-size:10px}
.layer .lb{padding:5px 6px;display:none}
.layer.open .lb{display:block}
.mini{padding:2px 6px;font-size:10px}

table.kv{width:100%;border-collapse:collapse;font-size:11px}
table.kv td{padding:1.5px 0;vertical-align:top}
table.kv td:first-child{color:var(--ink2);padding-right:6px}
table.kv td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.kv tr.hi td:last-child{color:var(--accent)}
table.kv tr.bad td:last-child{color:var(--danger)}
table.kv tr.good td:last-child{color:var(--ok)}

#log{max-height:190px;overflow-y:auto;font-size:10.5px;line-height:1.5}
#log div{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.03);display:flex;gap:6px}
#log .t{color:var(--dim);flex:0 0 62px;text-align:right;font-variant-numeric:tabular-nums}
#log .s2{color:var(--warn)} #log .s3{color:var(--danger);font-weight:600}

.verdict{border-radius:4px;padding:7px 9px;margin-bottom:7px;border:1px solid var(--edge2);background:#101620}
.verdict.pen{border-color:#8e3a30;background:#1c1113}
.verdict.stop{border-color:#2f6a45;background:#0f1a14}
.verdict h4{font-size:13px;margin-bottom:2px}
.verdict p{color:var(--ink2);font-size:10.5px;line-height:1.4}

.note{font-size:10px;color:var(--dim);line-height:1.5;border-left:2px solid var(--edge2);padding-left:7px;margin:5px 0}
a{color:var(--accent)}

/* ----------------------------------------------------------- responsive */
/* assigned to its own row only in the mobile layout below; on desktop it is
   not rendered at all */
#tabs{display:none}
/* Coarse pointers get larger hit targets: 36 px is the smallest control that
   is comfortably tappable, and it keeps the dense engineering layout usable
   without changing any of it. */
@media (pointer: coarse){
  button{min-height:36px;padding:8px 12px}
  button.icon{min-width:42px;font-size:15px}
  button.mini{min-height:30px}
  input[type=number],input[type=text],select{min-height:34px;font-size:13px}
  .row input[type=range]{height:30px}
  #scrub{height:30px}
  .layer .lh{padding:9px 8px}
  .panel>h3{padding:11px 10px}
}

@media (max-width: 980px){
  #app{grid-template-columns:1fr;grid-template-rows:44px auto 1fr;
    grid-template-areas:"top" "tabs" "main"}
  #tabs{grid-area:tabs;display:flex;gap:4px;background:#12171f;border-bottom:1px solid var(--edge);
    padding:4px max(6px,env(safe-area-inset-right)) 4px max(6px,env(safe-area-inset-left));
    overflow-x:auto;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  #tabs button{flex:0 0 auto;font-size:12px}
  /* the HUD chips already carry the live readouts, so the top bar gives its
     width to the controls instead */
  #top .readout,#top .sep{display:none}
  .brand{font-size:11px;letter-spacing:0}
  #legend{max-width:132px;font-size:8.5px;padding:4px 6px;opacity:.92}
  #legend .ends{font-size:8px}
  /* the rails share the viewport's grid cell instead of being positioned
     against a hard-coded header height, so notches and the dynamic URL bar
     cannot push them off-screen */
  /* the id selectors in the desktop layout outrank a bare `aside` rule, so the
     override has to match their specificity */
  #left,#right{grid-area:main;position:relative;z-index:30;display:none;border:none}
  #left.show,#right.show{display:block}
  #main{grid-area:main}
  .brand small{display:none}
  /* keep the field legend clear of the readout chips on a narrow screen */
  #legend{top:auto;bottom:10px;right:8px;max-width:150px;font-size:9px}
  #hud{max-width:calc(100% - 20px)}
  .chip{font-size:9.5px;padding:2px 5px}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">TERMINAL&nbsp;BALLISTICS <small>&nbsp;— deformable-armour sandbox</small></div>
    <div class="sep"></div>
    <button class="fire" id="btnFire">FIRE</button>
    <button class="icon" id="btnReset" title="Reset (R)">⟲</button>
    <div class="sep"></div>
    <button class="icon" id="btnPlay" title="Play / pause (space)">⏸</button>
    <button class="icon" id="btnStepB" title="Step back one frame (,)">⏴</button>
    <button class="icon" id="btnStepF" title="Step forward (.)">⏵</button>
    <button class="icon" id="btnStep10" title="Advance 10 solver steps">⏭</button>
    <div class="sep"></div>
    <div class="readout"><b id="roState">idle</b><span>state</span></div>
    <div class="readout"><b id="roTime">0 µs</b><span>sim time</span></div>
    <div class="readout"><b id="roDepth">—</b><span>depth</span></div>
    <div class="readout"><b id="roVres">—</b><span>residual v</span></div>
    <div class="readout"><b id="roNodes">—</b><span>nodes/bonds</span></div>
    <div class="readout"><b id="roPerf">—</b><span>solver ms</span></div>
    <div class="spacer"></div>
    <button id="btnDocs" title="Model assumptions">MODEL</button>
  </header>

  <nav id="tabs">
    <button data-panel="left" class="on">Setup</button>
    <button data-panel="right">Results</button>
    <button data-panel="none">Viewport</button>
  </nav>

  <aside id="left"></aside>

  <main id="main">
    <div id="view">
      <canvas id="viewport"></canvas>
      <canvas id="viewportField"></canvas>
      <canvas id="viewportFx"></canvas>
      <div id="hud"></div>
      <div id="legend"></div>
    </div>
    <div id="transport">
      <button class="icon" id="btnFollow" title="Camera follow">⦿</button>
      <button class="icon" id="btnZoomIn">＋</button>
      <button class="icon" id="btnZoomOut">－</button>
      <button class="icon" id="btnFit" title="Fit target">⛶</button>
      <span id="tlabel">frame 0 / 0</span>
      <input type="range" id="scrub" min="0" max="0" value="0" step="1">
      <button class="mini" id="btnLive">LIVE</button>
    </div>
  </main>

  <aside id="right"></aside>
</div>

<script>

/* ============================================================================
 * Terminal Ballistics Sandbox — single-file build
 * Generated by tools/build.mjs. Source of truth is the src/ tree.
 * ========================================================================= */
(function () {
'use strict';
var __defs = {}, __cache = {};
function __def(id, fn) { __defs[id] = fn; }

  if (__cache[id]) return __cache[id];
  var m = __cache[id] = {};
  if (!__defs[id]) throw new Error('module not bundled: ' + id);

  return m;
}

__def("src/core/math.js", function (__exports, __req) {
/**
 * Small numeric / geometric helpers shared by every subsystem.
 *
 * Everything in the simulator is SI (m, kg, s, Pa, J, K). Conversion to
 * display units happens only in src/core/units.js and the UI layer.
 */

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => (b === a ? 0 : (v - a) / (b - a));
const smoothstep = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
const hypot = (x, y) => Math.sqrt(x * x + y * y);

/** Deterministic PRNG (mulberry32). Used only for *modelled* material
 *  heterogeneity (Weibull-like strength scatter) and never to decide an
 *  outcome. Seeded so a scenario replays bit-identically. */
function makeRng(seed = 1) {
  let a = seed >>> 0;
  return function rng() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Weibull-distributed multiplier with unit mean-ish scatter, modulus m.
 *  Higher m => less scatter. Used for local flaw-density variation. */
function weibullFactor(rng, m) {
  const u = clamp(rng(), 1e-6, 1 - 1e-6);
  return Math.pow(-Math.log(u), 1 / m) / Math.pow(Math.log(2), 1 / m);
}

// ---------------------------------------------------------------------------
// Vector helpers (scalar form: no allocation in hot loops)
// ---------------------------------------------------------------------------

function rot(x, y, ang) {
  const c = Math.cos(ang), s = Math.sin(ang);
  return [x * c - y * s, x * s + y * c];
}

function normalize(x, y) {
  const l = Math.sqrt(x * x + y * y) || 1;
  return [x / l, y / l];
}

// ---------------------------------------------------------------------------
// Polygon geometry — target layers and internal modules are convex or simple
// polygons in world space, given as flat [x0,y0,x1,y1,...] arrays.
// ---------------------------------------------------------------------------

function polyCentroid(p) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, n = p.length / 2; i < n; i++) {
    const j = (i + 1) % n;
    const x0 = p[i * 2], y0 = p[i * 2 + 1], x1 = p[j * 2], y1 = p[j * 2 + 1];
    const cr = x0 * y1 - x1 * y0;
    a += cr; cx += (x0 + x1) * cr; cy += (y0 + y1) * cr;
  }
  a *= 0.5;
  if (Math.abs(a) < 1e-18) return [p[0], p[1], 0];
  return [cx / (6 * a), cy / (6 * a), Math.abs(a)];
}

function polyArea(p) { return polyCentroid(p)[2]; }

function pointInPoly(p, x, y) {
  let inside = false;
  for (let i = 0, n = p.length / 2, j = n - 1; i < n; j = i++) {
    const xi = p[i * 2], yi = p[i * 2 + 1], xj = p[j * 2], yj = p[j * 2 + 1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi + 1e-30) + xi) inside = !inside;
  }
  return inside;
}

function polyBounds(p) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (let i = 0; i < p.length; i += 2) {
    if (p[i] < x0) x0 = p[i];
    if (p[i] > x1) x1 = p[i];
    if (p[i + 1] < y0) y0 = p[i + 1];
    if (p[i + 1] > y1) y1 = p[i + 1];
  }
  return { x0, y0, x1, y1 };
}

/** Distance from point to polygon boundary (positive outside or inside). */
function distToPolyEdge(p, x, y) {
  let best = Infinity;
  for (let i = 0, n = p.length / 2, j = n - 1; i < n; j = i++) {
    const ax = p[j * 2], ay = p[j * 2 + 1], bx = p[i * 2], by = p[i * 2 + 1];
    const dx = bx - ax, dy = by - ay;
    const l2 = dx * dx + dy * dy || 1e-30;
    let t = ((x - ax) * dx + (y - ay) * dy) / l2;
    t = clamp(t, 0, 1);
    const px = ax + t * dx - x, py = ay + t * dy - y;
    const d = Math.sqrt(px * px + py * py);
    if (d < best) best = d;
  }
  return best;
}

/**
 * Ray/segment vs polygon. Returns the nearest entry hit along the ray in
 * [0, maxT], or null. Also returns the outward edge normal at the hit.
 */
function rayPoly(ox, oy, dx, dy, p, maxT = Infinity) {
  let bestT = maxT, nx = 0, ny = 0, found = false;
  for (let i = 0, n = p.length / 2, j = n - 1; i < n; j = i++) {
    const ax = p[j * 2], ay = p[j * 2 + 1], bx = p[i * 2], by = p[i * 2 + 1];
    const ex = bx - ax, ey = by - ay;
    const den = dx * ey - dy * ex;
    if (Math.abs(den) < 1e-14) continue;
    const t = ((ax - ox) * ey - (ay - oy) * ex) / den;
    const u = ((ax - ox) * dy - (ay - oy) * dx) / den;
    if (t >= 0 && t < bestT && u >= 0 && u <= 1) {
      bestT = t; found = true;
      const l = Math.sqrt(ex * ex + ey * ey) || 1;
      // polygons are wound CCW => outward normal is (ey, -ex)/l
      nx = ey / l; ny = -ex / l;
    }
  }
  return found ? { t: bestT, nx, ny } : null;
}

/** Build a CCW rectangle polygon from centre, half extents and rotation. */
function rectPoly(cx, cy, hw, hh, ang = 0) {
  const c = Math.cos(ang), s = Math.sin(ang);
  const pts = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]];
  const out = new Float64Array(8);
  for (let i = 0; i < 4; i++) {
    out[i * 2] = cx + pts[i][0] * c - pts[i][1] * s;
    out[i * 2 + 1] = cy + pts[i][0] * s + pts[i][1] * c;
  }
  return out;
}

/** Ensure counter-clockwise winding (positive signed area). */
function ensureCCW(p) {
  let a = 0;
  for (let i = 0, n = p.length / 2; i < n; i++) {
    const j = (i + 1) % n;
    a += p[i * 2] * p[j * 2 + 1] - p[j * 2] * p[i * 2 + 1];
  }
  if (a < 0) {
    const out = new Float64Array(p.length);
    const n = p.length / 2;
    for (let i = 0; i < n; i++) {
      out[i * 2] = p[(n - 1 - i) * 2];
      out[i * 2 + 1] = p[(n - 1 - i) * 2 + 1];
    }
    return out;
  }

 * ==================
 *

 * --------------

 * projectile velocity at the moment the domain is created, axis `b`
 * perpendicular to it. Only the corridor the projectile can actually reach is
 * meshed; armour outside that corridor is drawn as static geometry and its
 * mechanical role is represented by the boundary treatment at the corridor
 * edges. This is a "domain of interest" reduction — it is what makes a
 * research-style continuum model run at interactive rates in a browser — and
 * it is documented as assumption A4 in docs/MODEL.md.
 *

 * regular peridynamic lattice biases crack paths along the lattice axes; the
 * jitter breaks that symmetry. Bonds are built from the jittered reference
 * configuration, so the initial state is exactly force-free.
 *
 * BONDS
 * -----
 * A bond exists between two sites of the same `bondGroup` whose reference
 * separation is below the horizon. Bonds are never deleted: a broken bond
 * stops carrying tension and becomes a contact pair instead, which is both
 * cheaper and more correct than removing it (crater walls, channel walls and
 * comminuted material still push on each other).

  PENETRATOR: 1,
  PROJ_AUX: 2,   // caps, windscreens, sabot petals, casing
  FILLER: 3,     // explosive fill
  MODULE: 4,     // internal component that was meshed
};

const BOND = { INTACT: 0, BROKEN: 1 };

  /**
   * @param {object} o
   * @param {number} o.dx        lattice spacing (m)
   * @param {number} o.mRatio    horizon / spacing
   * @param {number} o.slab      out-of-plane slab depth (m)
   * @param {number[]} o.origin  world origin of the shot frame
   * @param {number[]} o.dir     unit shot direction
   * @param {number} o.length    corridor length along the shot axis (m)
   * @param {number} o.width     corridor width across the shot axis (m)
   */

/**
 * PROJECTILE LIBRARY
 * ==================
 *
 * Each type is a *geometry + material + behaviour* description, not a label.
 * The differences between an APCBC shell and a long rod are expressed as
 *   - different cross-sections (so the meshed body is different),
 *   - different materials per part (so the constitutive response differs),
 *   - different assembly interfaces (so parts separate when they should),
 *   - different in-flight/fuzing behaviours (sabot discard, fuze delay, jet).
 * Everything downstream of that - erosion, shatter, ricochet, plugging - is
 * produced by the peridynamic solver, not by the type.
 *
 * OUT-OF-PLANE MASS CORRECTION
 * ----------------------------
 * The simulation is a plane-strain slice of depth h. A plate is genuinely
 * prismatic, so a slice of it needs no correction. A projectile is a body of
 * revolution, so a slice of width 2r(x) does not carry the right mass. Each
 * part therefore gets a scale factor
 *
 *      scale = (pi/4) * d_part / h,      h = (pi/4) * d_penetrator
 *
 * applied to both its density and its micromodulus. That preserves the part's
 * true mass and true axial force per unit of slab, and leaves the wave speed
 * unchanged. See docs/MODEL.md §2.3.
 */

const { ensureCCW, clamp, DEG } = __req("src/core/math.js");

// ---------------------------------------------------------------------------
// geometry helpers (local frame: +x = direction of travel, nose tip at x = 0)
// ---------------------------------------------------------------------------

/** Build a closed silhouette from a radius profile r(x), x in [-L, 0]. */
function profilePoly(rf, L, samples = 30, xEnd = 0) {
  const top = [], bot = [];
  for (let k = 0; k <= samples; k++) {
    const x = xEnd - L * (k / samples);
    const r = Math.max(1e-5, rf(x));
    top.push(x, r);
    bot.push(x, -r);
  }
  const pts = [];
  for (let k = 0; k < top.length; k += 2) pts.push(top[k], top[k + 1]);
  for (let k = bot.length - 2; k >= 0; k -= 2) pts.push(bot[k], bot[k + 1]);
  return ensureCCW(Float64Array.from(pts));
}

function box(x0, x1, r) {
  return ensureCCW(Float64Array.from([x0, -r, x1, -r, x1, r, x0, r]));
}

/** Nose radius profiles. x measured back from the tip (negative). */
function noseProfile(kind, R, noseLen, tipR = 0) {
  switch (kind) {
    case 'conical': return (x) => clamp(tipR + (R - tipR) * (-x / noseLen), 0, R);
    case 'blunt': return (x) => (-x < noseLen * 0.25 ? tipR + (R - tipR) * (-x / (noseLen * 0.25)) : R);
    case 'round': return (x) => R * Math.sqrt(Math.max(0, 1 - Math.pow(1 + x / noseLen, 2)));
    case 'ogive':
    default: {
      // secant ogive with a small meplat
      return (x) => {
        const f = clamp(-x / noseLen, 0, 1);
        return clamp(tipR + (R - tipR) * Math.sqrt(1 - (1 - f) * (1 - f)), 0, R);
      };
    }
  }
}

/** Full body: ogive/blunt nose blended into a cylinder, optional boat tail. */

  const nose = noseProfile(kind, R, noseLen, tipR);
  return (x) => {
    if (x > -noseLen) return nose(x);
    if (boatTail > 0 && x < -(L - boatTail)) {
      const f = (-x - (L - boatTail)) / boatTail;
      return R * (1 - 0.28 * f);
    }
    return R;
  };

/**
 * RIGID-BODY FLIGHT REGIME
 * ========================
 *
 * Away from contact the projectile is a rigid body: there is nothing for a
 * continuum solver to resolve, and the peridynamic time step (~0.2 us) would
 * make a 2 m approach take millions of steps for no physical content.
 *
 * The projectile is therefore integrated as a rigid body with drag and gravity
 * until it is a few lattice spacings from the target, at which point the world
 * hands its exact state (position, orientation, velocity, spin, geometry,
 * per-part materials) to the peridynamic mesher. Nothing is idealised at the
 * handover: the body that gets meshed is the body that was flying.
 *
 * The same class is reused for the *residual* penetrator after perforation,
 * rebuilt from whatever coherent mass survived, so a second plate is engaged
 * by the real remnant rather than by a fresh projectile.
 */

const RHO_AIR = 1.225;

  constructor(cfg) {
    this.cfg = cfg;
    this.geom = buildProjectile(cfg);
    this.type = PROJECTILE_TYPES[cfg.type];
    this.slab = this.geom.slab;

    // --- mass properties -------------------------------------------------
    // Parts overlap (a cavity polygon sits inside its shell polygon) and the
    // mesher resolves that by first-match priority. Mass is therefore measured

/**
 * FRAGMENT / SPALL TRANSPORT
 * ==========================
 *
 * Fragments are never spawned decoratively. Every fragment in this system was
 * promoted from the peridynamic solution: a particle (or a small coherent
 * cluster) whose bonds all failed and which then left the meshed corridor.
 * It carries the mass, velocity and energy it had at the moment it detached.
 *
 * Inside the corridor, spall is simply peridynamic material — it is drawn from
 * the particle state and can still collide with the penetrator and the channel
 * walls. Promotion happens only when a particle leaves the meshed region,
 * because past that point there is nothing left for the continuum solver to
 * do and a ballistic point mass is both cheaper and equally accurate.
 *
 * PERFORATION OF THIN STRUCTURE BY A FRAGMENT
 * -------------------------------------------
 * A promoted fragment that strikes a thin plate or a component casing is
 * resolved with a plugging-work model rather than a fresh continuum run:
 *
 *   E_perf = k * pi * d * t^2 * tau        (shear-out of a plug)
 *   v_bl   = sqrt(2 E_perf / m)
 *   v_r    = (m / (m + m_plug)) * sqrt(v^2 - v_bl^2)      (Recht-Ipson, p = 2)
 *
 * with tau ~ 0.6 UTS and k a shape factor. This is the standard engineering
 * treatment for compact fragments and is documented in docs/MODEL.md §6.
 */

const { pointInPoly, clamp } = __req("src/core/math.js");
const { modulePoly, MODULE_TYPES } = __req("src/sim/scene.js");

const RHO_AIR = 1.225;

class FragmentSystem {
  constructor(bus, log) {
    this.list = [];
    this.bus = bus;
    this.log = log;
    this.nextId = 1;
    this.impacts = [];
  }

  clear() { this.list.length = 0; this.impacts.length = 0; this.nextId = 1; }

  add(f) {
    const frag = Object.assign({
      id: this.nextId++, x: 0, y: 0, vx: 0, vy: 0, mass: 1e-4,
      size: 0.002, kind: 'spall', matKey: 'rha', bornAt: 0,
      alive: true, trail: [], stopped: false, source: 'armour',
    }, f);
    frag.ke0 = 0.5 * frag.mass * (frag.vx * frag.vx + frag.vy * frag.vy);
    this.list.push(frag);

  }

  get count() { return this.list.length; }
  get liveCount() { return this.list.reduce((a, f) => a + (f.alive && !f.stopped ? 1 : 0), 0); }

  totalEnergy() {
    let e = 0;
    for (const f of this.list) if (f.alive) e += 0.5 * f.mass * (f.vx * f.vx + f.vy * f.vy);

   * Ballistic transport + interaction with scene geometry.
   * @param {number} dt simulated seconds
   */
  step(dt, scene, tNow, internals) {

      if (!f.alive || f.stopped) continue;
      const v = Math.hypot(f.vx, f.vy);

      f.vy -= (f.vy / v) * a * dt;

      const s = res.vr / Math.max(1e-6, Math.hypot(f.vx, f.vy));
      f.vx *= s; f.vy *= s; f.mass = res.mass;
    }
    // --- internal components --------------------------------------------
    for (const m of scene.modules) {
      const poly = modulePoly(m);
      if (!pointInPoly(poly, f.x, f.y) || pointInPoly(poly, x0, y0)) continue;
      const casing = perforate(f, m.casing, scene.casingMat);
      if (!casing.through) {
        f.stopped = true;
        this.log.add(tNow, 'frag-casing', `Fragment ${f.id} stopped by ${MODULE_TYPES[m.type].label} casing`, 0);

 * Plugging-work perforation of a plate of thickness t by a compact fragment.
 * Returns {through, vr, mass, vbl}.

  if (v <= vbl) return { through: false, vr: 0, mass: f.mass, vbl };

__def("src/core/events.js", function (__exports, __req) {
/**
 * Minimal event bus + a timestamped simulation event log.
 *
 * The log is the audit trail of the run: every physically meaningful
 * transition (first contact, bond-failure onset, back-face rupture, sabot
 * discard, fuze arming, detonation, module hit, ...) is recorded with the
 * simulation time and the state that produced it. It is the primary object
 * the post-impact report is built from.
 */

class Bus {
  constructor() { this.map = new Map(); }
  on(type, fn) {
    if (!this.map.has(type)) this.map.set(type, new Set());
    this.map.get(type).add(fn);
    return () => this.off(type, fn);
  }
  off(type, fn) { const s = this.map.get(type); if (s) s.delete(fn); }
  emit(type, payload) {
    const s = this.map.get(type);
    if (s) for (const fn of s) fn(payload);
    const a = this.map.get('*');
    if (a) for (const fn of a) fn({ type, payload });
  }
}

const SEV = { INFO: 0, NOTE: 1, MAJOR: 2, CRITICAL: 3 };

class EventLog {
  constructor() { this.entries = []; this.seq = 0; }
  clear() { this.entries.length = 0; this.seq = 0; }
  add(t, type, text, severity = SEV.INFO, data = null) {
    const e = { id: this.seq++, t, type, text, severity, data };
    this.entries.push(e);
    return e;
  }
  /** Only add once per type (used for one-shot transitions). */
  addOnce(t, type, text, severity = SEV.INFO, data = null) {
    if (this.entries.some((e) => e.type === type)) return null;
    return this.add(t, type, text, severity, data);
  }
  has(type) { return this.entries.some((e) => e.type === type); }
  get(type) { return this.entries.find((e) => e.type === type) || null; }
  since(t) { return this.entries.filter((e) => e.t >= t); }
}

__exports.__all = {Bus, SEV, EventLog};

 * INTERNAL DAMAGE MODEL
 * =====================
 *
 * Components are not meshed. Once something has got through the armour, the
 * question is no longer a continuum-mechanics question — it is an energy and
 * vulnerability question — so components are resolved analytically:
 *
 *   1. the striker must defeat the component casing (plugging-work model,
 *      shared with the fragment transport in fragments.js);
 *   2. the energy that survives is compared with a component toughness scale;
 *   3. component-specific consequences are applied.
 *
 * The toughness scales are *engineering placeholders*, not validated
 * vulnerability data. They are exposed in the UI so the user can see and edit
 * exactly what is driving each verdict. Nothing here is calibrated against
 * live-fire results and it should not be read as if it were.

    this.events = [];

  reset() { this.events.length = 0; this.catastrophic = false; this.scene.resetDamage(); }

    if (m.type === 'void') return;

    // large hit can destroy outright

__def("src/sim/explosive.js", function (__exports, __req) {
/**
 * EXPLOSIVE ENERGY RELEASE
 * ========================
 *
 * Detonation is modelled as an *impulsive velocity field* applied to the metal
 * surrounding the charge, with the filler particles removed (they have become
 * gas). Fragmentation is not scripted: the imposed expansion velocity field
 * stretches the casing bonds past their failure strain and the casing breaks
 * up on its own, with the fragment size distribution set by the material's
 * failure strain and the local strength scatter. That is the same mechanism
 * Mott's fragmentation theory describes, arrived at by simulation rather than
 * by a fitted distribution.
 *
 * Fragment/flyer velocity comes from the Gurney energy model (Gurney, BRL-405,
 * 1943), which is the standard first-order result for metal accelerated by a

/**
 * EXPLOSIVE REACTIVE ARMOUR
 * =========================
 *
 * An ERA cassette is a sandwich: a steel front plate, a slab of insensitive
 * explosive, a steel back plate. It is meshed as three ordinary bonded layers,
 * so the plates are ordinary deformable armour and the charge is ordinary

 *      plates either side of it.

 * INITIATION - Held's v^2 * d

 * plug very fast and must not set off an insensitive composition, while a
 * full-calibre AP shot drives a much wider region more slowly and must. This

 *     velocity. This ordered the threats better but still keyed on intensity
 *     alone, so a full-calibre AP shot - slow and wide - never initiated the

 * initiated at the explosive's detonation velocity, so a cassette struck near
 * one edge throws that end of its plates first. Across a 300 mm cassette at
 * 7000 m/s that is ~43 us of skew, which is the same order as the whole

 *
 * FLYER VELOCITY - Gurney sandwich
 * --------------------------------
 *     V = sqrt(2E) * (M/C + 1/3)^(-1/2)

 * between the two plates so their momenta balance (see below). This is the
 * plane-wave, fully-confined result and it overestimates a real cassette,
 * where the detonation runs along the sandwich rather than into it and the
 * products escape sideways from a thin unconfined slab. A single efficiency
 * factor covers that gap. It is a calibration constant, not a derivation, it
 * is exposed in the UI next to the out-of-plane confinement factor, and the

const { SEV } = __req("src/core/events.js");

const DRIVEN_FLOOR = 200;   // m/s

      gurney: mat.gurney || 2400,

 * Advance every cassette by dt. Returns a list of events worth logging.
 *
 * @param {Array} cassettes from buildCassettes

 * =================================
 *
 * The peridynamic run is the simulation. These closed-form engineering models
 * are *not* used to drive it — they are computed alongside it and reported
 * next to the simulated answer so the user can see whether the continuum model
 * is behaving sensibly for the case at hand.

 * mode this panel exists to prevent. Where the model and the correlations
 * disagree strongly, that disagreement is information.
 *
 * Models implemented
 * ------------------
 *  - Tate / Alekseevskii rigid-plastic long-rod penetration
 *      Tate, A. "A theory for the deceleration of long rods after impact",
 *      J. Mech. Phys. Solids 15 (1967) 387-399.
 *      Alekseevskii, V.P., Combust. Explos. Shock Waves 2 (1966) 63-66.
 *  - Hydrodynamic (Birkhoff) limit, P/L = sqrt(rho_p/rho_t)
 *      Birkhoff, MacDougall, Pugh & Taylor, J. Appl. Phys. 19 (1948) 563.
 *  - de Marre empirical penetration correlation (19th-c. naval gunnery fit,
 *      still the standard first-order estimate for capped AP shot vs RHA)
 *  - Recht-Ipson residual velocity after plugging
 *      Recht & Ipson, J. Appl. Mech. 30 (1963) 384-390.
 *  - Lambert-Jonas ballistic-limit form, v_r = a (v^p - v_bl^p)^(1/p)

 * Tate/Alekseevskii long-rod penetration, integrated numerically.
 * @returns {{depth:number, residualLength:number, residualVelocity:number,

function tatePenetration({ rhoP, rhoT, Yp, Rt, L0, v0, obliquity = 0, maxT = 1e-3 }) {
