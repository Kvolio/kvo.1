<!doctype html>
<meta charset="utf-8">
<title>Node surface regression checks</title>
<style>body{background:#111820;color:#e6edf3;font:16px system-ui;margin:32px}canvas{border:1px solid #506070;width:512px;height:256px}pre{white-space:pre-wrap}</style>
<h1>Node surface regression checks</h1>
<p>The detached orange node stays a separate piece; it must not change the solid surface or tint it.</p>
<canvas width="512" height="256"></canvas>
<pre id="result">Running…</pre>
<script type="module">
import { NodeGL, kernelLatticeSum } from '../src/render/nodegl.js';
const canvas = document.querySelector('canvas'), output = document.querySelector('#result');
try {
  const gl1 = new URLSearchParams(location.search).has('webgl1');
  const context = gl1 ? canvas.getContext('webgl', {alpha:true,premultipliedAlpha:true}) : null;
  const field = gl1 ? context && new NodeGL(canvas, context) : NodeGL.create(canvas);
  if (!field?.smoothOK) throw new Error('Smooth WebGL unavailable');
  const gl = field.gl, points = [];
  gl.disable(gl.DITHER);
  for (let y = -3; y <= 3; y++) for (let x = -9; x <= 9; x++) points.push([x * 0.02, y * 0.02]);
  field.ensure(points.length + 1);
  for (let i = 0; i < points.length; i++) {
    field.pos.set(points[i], i * 2); field.val[i] = 0; field.flag[i] = 1;
    field.col.set([0.5, 0.6, 0.7], i * 3);
  }
  const colours = () => { gl.bindBuffer(gl.ARRAY_BUFFER, field.bufCol); gl.bufferSubData(gl.ARRAY_BUFFER, 0, field.col.subarray(0, (points.length + 1) * 3)); };
  colours();
  const o = {count:points.length, cam:{x:0,y:0,scale:1000}, mode:'material', radiusPx:32, norm:1/kernelLatticeSum(1.6), extrude:null};
  const read = () => {const p = new Uint8Array(512 * 256 * 4); gl.readPixels(0, 0, 512, 256, gl.RGBA, gl.UNSIGNED_BYTE, p); return p;};
  field.clear(); field.drawSmooth(o);
  field.clear(); field.drawSmooth(o); const clean = read();
  const i = points.length;
  field.pos.set([0.198, 0.015], i * 2); field.val[i] = 1; field.flag[i] = 3;
  field.col.set([1, 0.3, 0.1], i * 3);
  colours();
  field.clear(); field.drawSmooth({...o,count:i+1}); const loose = read();
  for (const [name, pixels] of [['Solid alone', clean], ['Solid with detached node (surface pass only)', loose]]) {
    const label = document.createElement('p'); label.textContent = name;
    const preview = document.createElement('canvas'); preview.width = 512; preview.height = 256;
    preview.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(pixels),512,256),0,0);
    document.body.append(label,preview);
  }
  // Allow four byte levels for GPU/browser readback rounding across the
  // half-float accumulation and normalized canvas; geometry/tint changes are larger.
  let changed = 0, maxDelta = 0;
  for (let k = 0; k < clean.length; k++) { const delta = Math.abs(clean[k] - loose[k]); maxDelta = Math.max(maxDelta, delta); if (delta > 4) changed++; }
  field.drawPoints({...o,count:i+1,pointSize:12,onlyFree:true,skipUpload:true});
  const debris = read(); let visible = 0;
  for (let k = 0; k < debris.length; k++) if (debris[k] !== loose[k]) visible++;
  const error = gl.getError();
  output.textContent = `${changed === 0 ? 'PASS' : 'FAIL'}: detached node changed ${changed} solid-surface channels (maximum delta ${maxDelta})\n${visible > 0 ? 'PASS' : 'FAIL'}: detached node remains visible (${visible} channels)\n${error === gl.NO_ERROR ? 'PASS' : 'FAIL'}: WebGL error ${error}\nBackend: WebGL ${field.isGL2 ? 2 : 1}`;
  document.body.dataset.result = changed === 0 && visible > 0 && error === gl.NO_ERROR ? 'pass' : 'fail';
} catch (error) { output.textContent = `FAIL: ${error.message}`; document.body.dataset.result = 'fail'; }
</script>
