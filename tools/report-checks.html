<!doctype html>
<meta charset="utf-8">
<title>Completion and event report checks</title>
<style>
body{margin:24px;background:#0f1720;color:#e5edf4;font:14px system-ui}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.panel{background:#192430;border:1px solid #46586a;padding:16px}.note{background:#44371e;padding:12px;margin:12px 0;color:#ffe0a1}.hint{color:#abb9c7;font-size:12px;margin:10px 0}.kv{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:12px}h2{font-size:17px}h3{margin-top:0}h4{margin:4px 0}pre{white-space:pre-wrap}p{max-width:1000px}
</style>
<h1>Completion and event report checks</h1>
<p>Synthetic UI fixtures using the game's actual impact-report renderer. These check status messages, not ammunition performance.</p>
<pre id="results">Running…</pre><main id="cases"></main>
<script type="module">
import {App} from '../src/ui/app.js';
import {World} from '../src/sim/world.js';
import {makeProjectileConfig} from '../src/sim/projectileTypes.js';
const results=[];
function check(name,ok){results.push(`${ok?'PASS':'FAIL'}: ${name}`);}
function report(label,w){
  const section=document.createElement('section'),heading=document.createElement('h2');heading.textContent=label;
  const p=App.prototype.panelReport.call({world:w});section.append(heading,p);document.querySelector('#cases').append(section);return p.textContent;
}
for(const [flag,label] of [['debrisTruncated','Debris budget reached'],['truncated','Continuum budget reached']]){
  const w=new World();w.state='done';w.stats[flag]=true;
  const text=report(label,w);check(`${label}: result is explicitly provisional`,text.includes('Incomplete run:')&&text.includes('provisional'));
}
{
  const w=new World();w.state='done';check('ordinary completed result has no budget warning',!report('Completed normally',w).includes('Incomplete run:'));
}
for(const type of ['he','hesh','aphe','heat']){
  const w=new World();w.setProjectile(makeProjectileConfig(type));w.domain={n:0};w.trueContactTime=0;w.contactSeen=true;w.simTime=1;
  w.checkFuze();w.domain=null;w.state='done';
  const text=report(`${type.toUpperCase()} — missing event material`,w);
  check(`${type}: missing event material is visible`,text.includes('unavailable / dud')&&w.projectile.fuzeState==='dud');
}
document.querySelector('#results').textContent=results.join('\n');document.body.dataset.result=results.some(r=>r.startsWith('FAIL'))?'fail':'pass';
</script>
